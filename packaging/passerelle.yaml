# Configuration Passerelle — à versionner avec vos pipelines (infrastructure as code)
# Les secrets restent des variables d’environnement ${…}, résolues au déploiement.

version: 1
clickhouse:
  endpoint: https://clickhouse.internal:8443
  database: logs
  user: '${CLICKHOUSE_USER}'
  password: '${CLICKHOUSE_PASSWORD}'
  # Compte d'écriture de la sortie Vector (vector.elasticsearch_output: clickhouse), distinct du compte de validation
  # sink_user: '${CLICKHOUSE_SINK_USER}'
  # sink_password: '${CLICKHOUSE_SINK_PASSWORD}'
  cluster: ''
  default_table: logs.events
  time_field: timestamp
  timezone: ''                        # UTC si le serveur et les colonnes de date sont en UTC : le SQL n'a alors plus besoin de préciser le fuseau
  text_fields: [message, error.message]
  index_mapping:
    'logs-*': logs.events
    'nginx-*': logs.nginx_access
    'metrics-*': metrics.samples
  field_mapping:
    '@timestamp': timestamp
  # Types des colonnes de la table cible, pour traduire fidèlement les champs facultatifs (Nullable),
  # multivalués (Array) et entiers. À produire avec :
  #   SELECT concat('    ', name, ': ', type) FROM system.columns WHERE database = 'logs' AND table = 'events' FORMAT TSVRaw
  columns: {}
  empty_as_missing: false             # true : dans une colonne String non Nullable, la chaîne vide représente un champ absent
  composite_mode: page                # stream : une agrégation composite devient une seule requête, sans pagination, lue en flux
  text_match: tokens                  # strict : chaque mot cherché est vérifié par une expression régulière, pour le découpage exact d'Elasticsearch
  lists:
    threshold: 0                      # au-delà de ce nombre de valeurs, une liste (terms, should…) quitte le SQL pour une table ; 0 : jamais
    table: ''                         # table des listes ; vide : passerelle_lists dans la base de données
    names: {}                         # empreinte d'une liste → nom lisible
kafka:
  bootstrap_servers: ''
  security_protocol: ''
  sasl_mechanism: SCRAM-SHA-512
  username: '${KAFKA_USERNAME}'
  password: '${KAFKA_PASSWORD}'
  ca_file: /etc/vector/certs/ca.pem
  consumer_group: ''
  input_topics: []
  output_topic: ''
vector:
  format: yaml
  log_namespace: true
  logstash_compat: true
  acknowledgements: true
  shadow_mode: false
  ecs_compatibility: v8               # comme Logstash 8 et suivants ; disabled pour les pipelines d'avant ECS. Un réglage du pipeline l'emporte
# Équivalence sur vos données (passerelle verify) : l'Elasticsearch à interroger, en lecture seule
# elasticsearch:
#   endpoint: https://elasticsearch.internal:9200
#   user: '${ES_USER}'
#   password: '${ES_PASSWORD}'
#   api_key: '${ES_API_KEY}'          # l'emporte sur user et password
# verify:
#   time_field: ''                    # champ de date côté Elasticsearch ; vide : celui que field_mapping envoie sur la colonne de temps
#   window: { length: 1h, lag: 10m }  # 1 h se terminant 10 minutes avant le lancement
#   tolerance: 1e-9
#   examples: 3
#   timeout: 60
# Aide aux cas « à reprendre » (passerelle assist) : un modèle local, facultatif, joint seulement avec --local-model
# assist:
#   model:
#     endpoint: http://127.0.0.1:11434  # seule la boucle locale est admise (127.0.0.1, ::1, localhost), en http
#     api: ollama                       # ou openai : un serveur local compatible avec /v1/chat/completions
#     model: ''
#     timeout: 300                      # secondes, par demande
#     max_attempts: 2                   # essais par cas
# Exploitation du service (passerelle serve) : jetons à portée, identité du reverse proxy, audit, métriques, traces
# server:
#   tokens:                           # en plus de PASSERELLE_TOKEN, qui garde toutes les portées (nom « principal »)
#     - name: ci                      # le nom paraît dans le journal, l'audit et les métriques ; jamais la valeur
#       token: '${PASSERELLE_TOKEN_CI}'
#       scopes: [translate, validate] # translate : traductions, inventaire, schéma, /v1/config ; validate : validations ; metrics : /metrics
#     - name: prometheus
#       token: '${PASSERELLE_TOKEN_PROMETHEUS}'
#       scopes: [metrics]
#   trusted_proxies: [127.0.0.1]      # adresses ou réseaux CIDR du reverse proxy ; seuls eux fixent l'identité, l'adresse du client et X-Request-Id
#   identity_header: X-Forwarded-User # l'utilisateur authentifié par le proxy (SSO), repris dans le journal et l'audit
#   metrics: true                     # false : /metrics n'existe pas
#   audit_log: /var/log/passerelle/audit.jsonl   # vide : l'audit passe par le journal du service (msg « audit »)
#   tracing:
#     endpoint: http://collecteur:4318/v1/traces   # OTLP/HTTP en JSON ; vide : pas de traces
#     headers:
#       authorization: 'Bearer ${OTEL_AUTHORIZATION}'
#     sample_ratio: 1                 # 0 à 1 ; un appelant qui a décidé d'échantillonner (traceparent) est suivi
#     service_name: passerelle
