        void norm(def rules) {
          for (def r : rules) {
            def gs = r.get('groups');
            for (int i = 0; i < gs.size(); i++) {
              if (gs.get(i) == '') { gs.set(i, 'core'); }
            }
          }
        }
        void add(List out, def v) { if (!out.contains(v)) { out.add(v); } }
        void appendUnique(Map container, String field, def value) {
          def current = container[field];
          if (current == null) {
            container[field] = [value];
          } else if (current instanceof List) {
            if (!current.contains(value)) { current.add(value); }
          } else if (current != value) {
            container[field] = [current, value];
          }
        }
