# Couverture : 3 directs, 0 à vérifier, 0 à reprendre

transforms:
  mutate:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # mutate
      if .n != null { .n = to_int(.n) ?? .n }
      if exists(.k) { .k = push(array(.k) ?? [.k], "v") } else { .k = "v" }
      .tags = compact(flatten([.tags, "converti"]))
