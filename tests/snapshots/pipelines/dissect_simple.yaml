# Couverture : 3 directs, 0 à vérifier, 0 à reprendre
# À vérifier : Vector 0.57 et suivants : interpolation à activer

transforms:
  dissect:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # dissect
      parsed, err = parse_regex(.message, r'^(?P<date>.*?) (?P<niveau>.*?) \[(?P<service>.*?)\] (?P<texte>.*)$$')
      if err == null {
        .date = parsed.date
        .niveau = parsed.niveau
        .service = parsed.service
        .texte = parsed.texte
      } else if exists(.message) {
        .tags = compact(flatten([.tags, "_dissectfailure"]))
      }
