# Couverture : 3 directs, 0 à vérifier, 0 à reprendre
# À vérifier : Vector 0.57 et suivants : interpolation à activer

transforms:
  mutate:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # mutate
      ref_1 = if .nom == null { "%{nom}" } else if is_array(.nom) { (join(map_values(flatten(array!(.nom))) -> |item| { if item == null { "" } else { to_string(item) ?? encode_json(item) } }, ",") ?? "") } else { to_string(.nom) ?? encode_json(.nom) }
      . = remove!(., split(replace(ref_1, r'^\[|\]$$', ""), "]["))
