# Couverture : 3 directs, 0 à vérifier, 0 à reprendre

transforms:
  json:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # json
      parsed, err = parse_json(.message)
      if err == null {
        .doc = parsed
      } else if .message != null {
        .tags = compact(flatten([.tags, "_jsonparsefailure"]))
      }
