# Couverture : 3 directs, 0 à vérifier, 0 à reprendre
# À vérifier : Date sans année

transforms:
  date:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # date
      ts = null
      if ts == null {
        ts = parse_timestamp(.ts, "%b %d %H:%M:%S") ?? null
      }
      if ts != null {
        ."@timestamp" = ts
      } else {
        .tags = compact(flatten([.tags, "_dateparsefailure"]))
      }
