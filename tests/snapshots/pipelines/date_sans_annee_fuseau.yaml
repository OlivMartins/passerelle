# Couverture : 3 directs, 0 à vérifier, 0 à reprendre

transforms:
  date:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # date
      if .ts != null {
        ts = null
        if ts == null {
          text = to_string(.ts) ?? ""
          year = to_int!(format_timestamp!(now(), format: "%Y", timezone: "Europe/Paris"))
          ts = parse_timestamp(to_string(year) + " " + text, "%Y %b %d %H:%M:%S", timezone: "Europe/Paris") ?? null
          if ts != null {
            months = format_timestamp!(ts, format: "%m", timezone: "Europe/Paris") + format_timestamp!(now(), format: "%m", timezone: "Europe/Paris")
            if months == "1201" { ts = parse_timestamp(to_string(year - 1) + " " + text, "%Y %b %d %H:%M:%S", timezone: "Europe/Paris") ?? null }
            if months == "0112" { ts = parse_timestamp(to_string(year + 1) + " " + text, "%Y %b %d %H:%M:%S", timezone: "Europe/Paris") ?? null }
          }
        }
        if ts != null {
          ."@timestamp" = ts
        } else {
          .tags = compact(flatten([.tags, "_dateparsefailure"]))
        }
      }
