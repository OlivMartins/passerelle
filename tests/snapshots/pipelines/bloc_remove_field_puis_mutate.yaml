# Couverture : 4 directs, 0 à vérifier, 0 à reprendre

transforms:
  condition_1:
    type: remap
    inputs: [stdin_in_init]
    source: |
      if .t == "x" {
        # grok
        parsed, err = parse_grok(.message, s'%{IP:ip}')
        if err == null {
          . = merge(object!(.), parsed)
          del(.message)
        } else {
          .tags = compact(flatten([.tags, "_grokparsefailure"]))
        }
        # mutate
        if is_string(.message) { .message = upcase!(.message) }
      }
