# Couverture : 3 directs, 1 à vérifier, 0 à reprendre
# À vérifier : date locale

transforms:
  date:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # date
      if .ts != null {
        ts = null
        if ts == null {
          ts = parse_timestamp(.ts, "%d %B %Y") ?? null
        }
        if ts != null {
          ."@timestamp" = ts
        } else {
          .tags = compact(flatten([.tags, "_dateparsefailure"]))
        }
      }
