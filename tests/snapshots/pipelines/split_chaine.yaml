# Couverture : 3 directs, 0 à vérifier, 0 à reprendre

transforms:
  split:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # split
      parts = null
      if is_string(.liste) {
        parts = split!(.liste, ",")
        if length(parts) == 1 && .liste != "" { parts = null }
      } else if is_array(.liste) {
        parts = .liste
      } else {
        .tags = compact(flatten([.tags, "_split_type_failure"]))
      }
      if parts != null {
        .liste = filter(array!(parts)) -> |_index, value| { value != null && value != "" }
        . = unnest!(.liste)
      }
