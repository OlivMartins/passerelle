# Couverture : 3 directs, 0 à vérifier, 0 à reprendre

transforms:
  mutate:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # mutate
      if exists(.k) { .k = push(array(.k) ?? [.k], "v-" + (to_string(.n) ?? join(.n, ",") ?? encode_json(.n))) } else { .k = "v-" + (to_string(.n) ?? join(.n, ",") ?? encode_json(.n)) }
