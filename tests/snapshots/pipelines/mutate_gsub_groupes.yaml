# Couverture : 3 directs, 0 à vérifier, 0 à reprendre
# À vérifier : Tableaux dans mutate
# À vérifier : Vector 0.57 et suivants : interpolation à activer

transforms:
  mutate:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # mutate
      if is_string(.a) { .a = replace!(.a, r'([0-9A-Za-z_]+)@([0-9A-Za-z_]+)', "$${2} at $${1}") }
