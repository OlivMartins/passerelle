# Couverture : 3 directs, 0 à vérifier, 0 à reprendre

transforms:
  grok:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # grok
      parsed, err = parse_grok(.message, s'%{NUMBER:entier} %{NUMBER:flottant} %{NUMBER:texte}')
      if err == null {
        . = merge(object!(.), parsed)
        .entier = to_int(.entier) ?? .entier
        .flottant = to_float(.flottant) ?? .flottant
      } else {
        .tags = compact(flatten([.tags, "_grokparsefailure"]))
      }
