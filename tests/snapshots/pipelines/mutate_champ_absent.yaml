# Couverture : 3 directs, 0 à vérifier, 0 à reprendre
# À vérifier : Tableaux dans mutate
# À vérifier : Vector 0.57 et suivants : interpolation à activer

transforms:
  mutate:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # mutate
      if is_string(.a) { .a = replace!(.a, r'x', "y") }
      if is_string(.b) { .b = upcase!(.b) }
      if is_string(.d) { .d = upcase(truncate!(.d, 1)) + downcase(replace!(.d, r'(?s)^.', "")) }
      if is_string(.c) { .c = downcase!(.c) }
      if is_string(.e) { .e = strip_whitespace!(.e) }
      if is_string(.f) {
        .f = split(replace!(.f, r',+$$', ""), ",")
        if .f == [""] { .f = [] }
      }
      if is_array(.g) { .g = join(.g, ",") ?? .g }
      if .h != null { .i = .h }
