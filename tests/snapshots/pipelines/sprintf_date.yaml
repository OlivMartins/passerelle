# Couverture : 3 directs, 0 à vérifier, 0 à reprendre

transforms:
  mutate:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # mutate
      if exists(.jour) { .jour = push(array(.jour) ?? [.jour], (format_timestamp(timestamp(."@timestamp") ?? parse_timestamp(."@timestamp", "%+") ?? now(), format: "%Y.%m.%d") ?? "")) } else { .jour = (format_timestamp(timestamp(."@timestamp") ?? parse_timestamp(."@timestamp", "%+") ?? now(), format: "%Y.%m.%d") ?? "") }
      if exists(.heure) { .heure = push(array(.heure) ?? [.heure], (format_timestamp(timestamp(."@timestamp") ?? parse_timestamp(."@timestamp", "%+") ?? now(), format: "%H:%M:%S") ?? "")) } else { .heure = (format_timestamp(timestamp(."@timestamp") ?? parse_timestamp(."@timestamp", "%+") ?? now(), format: "%H:%M:%S") ?? "") }
