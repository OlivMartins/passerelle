# Couverture : 3 directs, 0 à vérifier, 0 à reprendre

transforms:
  grok:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # grok
      parsed, err = parse_grok(.message, s'%{WORD:verb} %{NUMBER:ls__n__v}')
      if err == null {
        .http = merge(object(.http) ?? {}, parsed)
        .http.n.v = del(.http.ls__n__v)
        .http.n.v = to_int(.http.n.v) ?? .http.n.v
      } else {
        .tags = compact(flatten([.tags, "_grokparsefailure"]))
      }
