# Couverture : 3 directs, 0 à vérifier, 0 à reprendre

transforms:
  date:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # date
      ts = null
      if ts == null {
        n = to_int(.ts) ?? null
        if n != null {
          ts = from_unix_timestamp!(n)
        }
      }
      if ts != null {
        ."@timestamp" = ts
      } else {
        .tags = compact(flatten([.tags, "_dateparsefailure"]))
      }
