# Couverture : 3 directs, 0 à vérifier, 0 à reprendre

transforms:
  xml:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # xml
      parsed, err = parse_xml(.message)
      if err == null {
        .doc = parsed
      } else {
        .tags = compact(flatten([.tags, "_xmlparsefailure"]))
      }
