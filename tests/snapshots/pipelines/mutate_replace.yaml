# Couverture : 3 directs, 0 à vérifier, 0 à reprendre

transforms:
  mutate:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # mutate
      ref_1 = if .b == null { "%{b}" } else if is_array(.b) { (join(map_values(flatten(array!(.b))) -> |item| { if item == null { "" } else { to_string(item) ?? encode_json(item) } }, ",") ?? "") } else { to_string(.b) ?? encode_json(.b) }
      .a = "v-" + ref_1
