# Couverture : 3 directs, 0 à vérifier, 0 à reprendre

transforms:
  grok:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # grok
      parsed, err = parse_grok(.message, s'%{SYSLOGLINE}')
      if err == null {
        dup = {}
        for_each(parsed) -> |k, val| {
          old = get!(., [k])
          if old != null { dup = set!(dup, [k], push(array(old) ?? [old], val)) }
        }
        . = merge(object!(.), merge(parsed, dup))
        # Mode ECS : captures renommées comme dans les motifs ecs-v1 de Logstash
        if exists(.program) {
          v = del(.program)
          .process.name = v
        }
        if exists(.pid) {
          v = del(.pid)
          .process.pid = to_int(v) ?? v
        }
        if exists(.facility) {
          v = del(.facility)
          .log.syslog.facility.code = to_int(v) ?? v
        }
        if exists(.priority) {
          v = del(.priority)
          .log.syslog.priority = to_int(v) ?? v
        }
        if exists(.logsource) {
          v = del(.logsource)
          .host.hostname = v
        }
        if exists(.timestamp8601) {
          v = del(.timestamp8601)
          .timestamp = v
        }
      } else {
        .tags = compact(flatten([.tags, "_grokparsefailure"]))
      }
