# Couverture : 3 directs, 0 à vérifier, 0 à reprendre

transforms:
  json:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # json
      parsed, err = parse_json(.charge)
      if err == null {
        if is_object(parsed) {
          . = merge(object!(.), object!(parsed))
        }
      } else {
        .tags = compact(flatten([.tags, "_jsonparsefailure"]))
      }
