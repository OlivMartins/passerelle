# Couverture : 3 directs, 0 à vérifier, 0 à reprendre

transforms:
  mutate:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # mutate
      ref_1 = if .n == null { "%{n}" } else if is_array(.n) { (join(map_values(flatten(array!(.n))) -> |item| { if item == null { "" } else { to_string(item) ?? encode_json(item) } }, ",") ?? "") } else { to_string(.n) ?? encode_json(.n) }
      .tags = compact(flatten([.tags, "t1", "t-" + ref_1]))
