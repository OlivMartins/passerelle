# Couverture : 3 directs, 0 à vérifier, 0 à reprendre
# À vérifier : Vector 0.57 et suivants : interpolation à activer

transforms:
  bytes:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # bytes
      done = false
      if is_string(.s) {
        bs = replace(string!(.s), r'\A[\x00\t\n\x0B\x0C\r ]+|[\x00\t\n\x0B\x0C\r ]+\z', "")
        .s = bs
        m = parse_regex(bs, r'(?m)^(?P<n>[0-9 _,.]*)[\t\n\x0B\x0C\r ]*(?P<p>[kKmMgGtTpPeE]?)[bB]?$$') ?? null
        if m != null && length(split(string!(m.n), ".")) <= 2 {
          num = replace(replace(strip_whitespace(string!(m.n)), r'[^0-9.]', ""), ".", ".")
          if num != "" {
            f = to_float(num) ?? 0.0
            if m.p != "" { f = f * float!(get!({ "k": 1024.0, "m": 1048576.0, "g": 1073741824.0, "t": 1099511627776.0, "p": 1125899906842624.0, "e": 1152921504606847000.0 }, [downcase(string!(m.p))])) }
            .b = to_int(round(f))
            done = true
          }
        }
      }
      if !done {
        .tags = compact(flatten([.tags, "_bytesparsefailure"]))
      }
