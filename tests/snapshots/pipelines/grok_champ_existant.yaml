# Couverture : 3 directs, 0 à vérifier, 0 à reprendre

transforms:
  grok:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # grok
      parsed, err = parse_grok(.message, s'%{WORD:verb} %{URIPATH:chemin}')
      if err == null {
        . = merge(object!(.), parsed)
      } else {
        .tags = compact(flatten([.tags, "_grokparsefailure"]))
      }
