# Couverture : 3 directs, 1 à vérifier, 0 à reprendre
# À vérifier : dissect

transforms:
  dissect:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # dissect
      parsed, err = parse_regex(.message, r'^(?P<quand>.*?) (?:.*?) (?P<texte>.*)$$')
      if err == null {
        .quand = parsed.quand
        .texte = parsed.texte
      } else if exists(.message) {
        .tags = compact(flatten([.tags, "_dissectfailure"]))
      }
