# Couverture : 3 directs, 0 à vérifier, 0 à reprendre

transforms:
  prune:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # prune
      orig = object!(.)
      . = filter(orig) -> |key, _value| { !match(key, r'(?:%\{[^}]+\})') }
      v = get!(orig, ["m"])
      if v != null && v != false {
        if is_array(v) {
          kept = filter(array!(v)) -> |_index, x| { !(is_string(x) && match(string!(x), r'(?m)^mauvais')) }
          if length(kept) != length(array!(v)) { if length(kept) == 0 { del(."m") } else { ."m" = kept } }
        } else if is_string(v) {
          if match(string!(v), r'(?m)^mauvais') { del(."m") }
        }
      }
