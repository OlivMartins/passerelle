# Couverture : 4 directs, 0 à vérifier, 0 à reprendre

transforms:
  mutate:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # mutate
      if exists(%cle) { %cle = push(array(%cle) ?? [%cle], "valeur") } else { %cle = "valeur" }
  mutate_2:
    type: remap
    inputs: [mutate]
    source: |
      # mutate
      ref_1 = if %cle == null { "%{[@metadata][cle]}" } else if is_array(%cle) { (join(map_values(flatten(array!(%cle))) -> |item| { if item == null { "" } else { to_string(item) ?? encode_json(item) } }, ",") ?? "") } else { to_string(%cle) ?? encode_json(%cle) }
      if exists(.k) { .k = push(array(.k) ?? [.k], ref_1) } else { .k = ref_1 }
