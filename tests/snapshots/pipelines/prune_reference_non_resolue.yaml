# Couverture : 4 directs, 0 à vérifier, 0 à reprendre
# À vérifier : Nom de champ dynamique

transforms:
  prune:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # mutate
      # prune
      orig = object!(.)
      . = filter(orig) -> |key, _value| { !match(key, r'(?:%\{[^}]+\})') }
