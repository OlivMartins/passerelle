# Couverture : 3 directs, 0 à vérifier, 0 à reprendre

transforms:
  fingerprint:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # fingerprint
      .empreinte = sha2("|" + "a|" + (to_string(.a) ?? join(.a, ",") ?? encode_json(.a)) + "|" + "b|" + (to_string(.b) ?? join(.b, ",") ?? encode_json(.b)) + "|", variant: "SHA-256")
