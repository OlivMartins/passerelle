# Couverture : 3 directs, 0 à vérifier, 0 à reprendre

transforms:
  split:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # split
      parts = null
      if is_string(.articles) {
        parts = split!(.articles, "\n")
        if length(parts) == 1 && .articles != "" { parts = null }
      } else if is_array(.articles) {
        parts = .articles
      } else {
        .tags = compact(flatten([.tags, "_split_type_failure"]))
      }
      if parts != null {
        .article = filter(array!(parts)) -> |_index, value| { value != null && value != "" }
        . = unnest!(.article)
      }
