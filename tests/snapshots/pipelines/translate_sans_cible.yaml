# Couverture : 3 directs, 0 à vérifier, 0 à reprendre

transforms:
  translate:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # translate
      key = (to_string(.code) ?? "")
      if key == "200" {
        .translation = "OK"
      } else if key == "404" {
        .translation = "Introuvable"
      }
