# Couverture : 3 directs, 0 à vérifier, 0 à reprendre

transforms:
  dissect:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # dissect
      parsed, err = parse_regex(.message, r'^(?P<a>.*?)\|(?P<b>.*)$$')
      if err == null {
        .a = parsed.a
        .b = parsed.b
      } else if exists(.message) {
        .tags = compact(flatten([.tags, "echec_decoupe"]))
      }
