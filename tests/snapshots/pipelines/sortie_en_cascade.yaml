# Couverture : 4 directs, 0 à vérifier, 0 à reprendre

transforms:
  routage:
    type: route
    inputs: [logstash_finalize]
    reroute_unmatched: false
    route:
      file: '(includes(array(.tags) ?? [], "alerte") || contains(string(.tags) ?? "", "alerte"))'
      file_b: '!((includes(array(.tags) ?? [], "alerte") || contains(string(.tags) ?? "", "alerte"))) && .region == "EMEA"'
      file_b_b: '!((includes(array(.tags) ?? [], "alerte") || contains(string(.tags) ?? "", "alerte"))) && !(.region == "EMEA")'
