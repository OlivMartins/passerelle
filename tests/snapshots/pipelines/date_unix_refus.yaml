# Couverture : 3 directs, 0 à vérifier, 0 à reprendre
# À vérifier : Vector 0.57 et suivants : interpolation à activer

transforms:
  date:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # date
      if .ts != null {
        ts = null
        if ts == null {
          if match(to_string(.ts) ?? "", r'^-?\d+(\.\d+)?$$') {
            ts = from_unix_timestamp(to_int(to_float!(.ts) * 1000), unit: "milliseconds") ?? null
          }
        }
        if ts != null {
          ."@timestamp" = ts
        } else {
          .tags = compact(flatten([.tags, "_dateparsefailure"]))
        }
      }
