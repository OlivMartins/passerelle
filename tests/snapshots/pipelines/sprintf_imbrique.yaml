# Couverture : 3 directs, 0 à vérifier, 0 à reprendre

transforms:
  mutate:
    type: remap
    inputs: [stdin_in_init]
    source: |
      # mutate
      ref_1 = if .a.b == null { "%{[a][b]}" } else if is_array(.a.b) { (join(map_values(flatten(array!(.a.b))) -> |item| { if item == null { "" } else { to_string(item) ?? encode_json(item) } }, ",") ?? "") } else { to_string(.a.b) ?? encode_json(.a.b) }
      ref_2 = if .a.c == null { "%{[a][c]}" } else if is_array(.a.c) { (join(map_values(flatten(array!(.a.c))) -> |item| { if item == null { "" } else { to_string(item) ?? encode_json(item) } }, ",") ?? "") } else { to_string(.a.c) ?? encode_json(.a.c) }
      if exists(.k) { .k = push(array(.k) ?? [.k], ref_1 + "/" + ref_2) } else { .k = ref_1 + "/" + ref_2 }
