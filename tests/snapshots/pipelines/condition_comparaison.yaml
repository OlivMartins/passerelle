# Couverture : 4 directs, 0 à vérifier, 0 à reprendre
# À vérifier : Comparaison à un nombre

transforms:
  condition_1:
    type: remap
    inputs: [stdin_in_init]
    source: |
      if ((is_integer(.n) || is_float(.n)) && (to_float(.n) ?? 0.0) > 10) {
        # mutate
        .tags = compact(flatten([.tags, "oui"]))
      } else {
        # mutate
        .tags = compact(flatten([.tags, "non"]))
      }
