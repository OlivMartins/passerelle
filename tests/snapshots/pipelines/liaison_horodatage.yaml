# Couverture : 5 directs, 0 à vérifier, 0 à reprendre

# Configuration Vector générée par Passerelle depuis 2 pipelines Logstash (pipelines.yml)
# Vérification complète (VRL compilé) : vector validate --skip-healthchecks <fichier>

data_dir: /var/lib/vector
api:
  enabled: true
  address: '127.0.0.1:8686'
sources:
  entree_stdin_in:
    type: stdin
    log_namespace: true
transforms:
  entree_stdin_in_init:
    type: remap
    inputs: [entree_stdin_in]
    source: |
      # Codec json : décodage de la ligne (invalide : gardée dans message, avec _jsonparsefailure)
      raw = string(.) ?? ""
      parsed, err = parse_json(raw)
      if err == null {
        . = object(parsed) ?? { "message": parsed }
        .event.original = raw
      } else {
        . = { "message": raw, "tags": ["_jsonparsefailure"] }
      }
      # Compatibilité Logstash : @timestamp et @version présents sur chaque événement
      if !exists(."@timestamp") {
        ."@timestamp" = now()
      }
      if !exists(."@version") {
        ."@version" = "1"
      }
  entree_logstash_finalize:
    type: remap
    inputs: [entree_stdin_in_init]
    source: |
      # @timestamp venu du document : lu comme par Logstash ; illisible, rangé dans _@timestamp
      if exists(."@timestamp") && !is_timestamp(."@timestamp") {
        iso = replace(string(."@timestamp") ?? "", ",", ".")
        ts = parse_timestamp(iso, "%+") ?? parse_timestamp(iso, "%Y-%m-%dT%H:%M:%S%.f") ?? parse_timestamp(iso, "%Y-%m-%d %H:%M:%S%.f") ?? parse_timestamp(iso, "%Y-%m-%dT%H:%M") ?? parse_timestamp(iso, "%Y-%m-%d %H:%M") ?? parse_timestamp(iso + "T00:00:00", "%Y-%m-%dT%H:%M:%S") ?? null
        if ts == null {
          ."_@timestamp" = ."@timestamp"
          ."@timestamp" = now()
          .tags = compact(flatten([.tags, "_timestampparsefailure"]))
        } else {
          ."@timestamp" = ts
        }
      }
      # Format de date identique à Logstash (millisecondes, UTC)
      if is_timestamp(."@timestamp") {
        ."@timestamp" = format_timestamp!(."@timestamp", format: "%Y-%m-%dT%H:%M:%S%.3fZ")
      }
  suite_pipeline_in_init:
    type: remap
    inputs: [entree_logstash_finalize]
    source: |
      # Événement reçu d’un autre pipeline : @timestamp redevient une date, comme dans Logstash
      if is_string(."@timestamp") {
        ."@timestamp" = parse_timestamp(string!(."@timestamp"), "%+") ?? ."@timestamp"
      }
      # Compatibilité Logstash : @timestamp et @version présents sur chaque événement
      if !exists(."@timestamp") {
        ."@timestamp" = now()
      }
      if !exists(."@version") {
        ."@version" = "1"
      }
  suite_mutate:
    type: remap
    inputs: [suite_pipeline_in_init]
    source: |
      # mutate
      if exists(.k) { .k = push(array(.k) ?? [.k], "v") } else { .k = "v" }
  suite_logstash_finalize:
    type: remap
    inputs: [suite_mutate]
    source: |
      # @timestamp venu du document : lu comme par Logstash ; illisible, rangé dans _@timestamp
      if exists(."@timestamp") && !is_timestamp(."@timestamp") {
        iso = replace(string(."@timestamp") ?? "", ",", ".")
        ts = parse_timestamp(iso, "%+") ?? parse_timestamp(iso, "%Y-%m-%dT%H:%M:%S%.f") ?? parse_timestamp(iso, "%Y-%m-%d %H:%M:%S%.f") ?? parse_timestamp(iso, "%Y-%m-%dT%H:%M") ?? parse_timestamp(iso, "%Y-%m-%d %H:%M") ?? parse_timestamp(iso + "T00:00:00", "%Y-%m-%dT%H:%M:%S") ?? null
        if ts == null {
          ."_@timestamp" = ."@timestamp"
          ."@timestamp" = now()
          .tags = compact(flatten([.tags, "_timestampparsefailure"]))
        } else {
          ."@timestamp" = ts
        }
      }
      # Format de date identique à Logstash (millisecondes, UTC)
      if is_timestamp(."@timestamp") {
        ."@timestamp" = format_timestamp!(."@timestamp", format: "%Y-%m-%dT%H:%M:%S%.3fZ")
      }
sinks:
  suite_file_out:
    type: file
    inputs: [suite_logstash_finalize]
    path: /work/out/liaison_horodatage.v8.ndjson
    encoding:
      codec: json
