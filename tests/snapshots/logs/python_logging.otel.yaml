# Configuration Vector générée par Passerelle depuis un échantillon de journaux (Python logging (date - logger - NIVEAU - message))
# Tests : vector test <fichier> rejoue les 4 lignes de l’échantillon et vérifie chaque champ
# Essai : placez l’échantillon dans ./echantillon.log, créez /var/lib/vector, puis vector --config <fichier>
# En production : remplacez la source « journaux » (file, kafka, journald, opentelemetry…) et la sortie « sortie »

data_dir: /var/lib/vector
sources:
  journaux:
    type: file
    include: [./echantillon.log]
    read_from: beginning
    multiline:
      start_pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}'
      mode: halt_before
      condition_pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}'
      timeout_ms: 1000
transforms:
  analyse_python_logging:
    type: remap
    inputs: [journaux]
    source: |
      # Passerelle — analyse des lignes au format « Python logging (date - logger - NIVEAU - message) »
      # Écrit à partir d’un échantillon de 4 événements (4 reconnus). Convention : OpenTelemetry.
      # Forme des événements de la source opentelemetry de Vector : .message (corps), .attributes, .resources, .severity_text.
      ligne = string(.message) ?? ""
      .attributes = object(.attributes) ?? {}
      .resources = object(.resources) ?? {}
      champs, erreur = parse_regex(ligne, r'^(?P<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) - (?P<logger>\S+) - (?P<level>DEBUG|INFO|WARNING|ERROR|CRITICAL|NOTSET) - (?P<msg>[\s\S]*)\z')
      if erreur != null {
        .attributes."log.parse.error" = "ligne non reconnue : format « Python logging (date - logger - NIVEAU - message) » attendu"
      } else {
        .attributes."log.record.original" = ligne
        horodatage1, erreur_horodatage1 = parse_timestamp(replace(string!(champs.time), ",", "."), "%Y-%m-%d %H:%M:%S%.f", timezone: "UTC")
        if erreur_horodatage1 == null {
          .timestamp = horodatage1
        }
        .scope.name = champs.logger
        niveau2 = string!(champs.level)
        .severity_text = niveau2
        niveau_min3 = downcase(niveau2)
        .severity_number = if includes(["trace", "finest", "finer", "trace1", "trace2", "trace3", "trace4", "trace5", "trace6", "trace7", "trace8"], niveau_min3) { 1 } else if includes(["debug", "fine", "dbg", "config", "verbose"], niveau_min3) { 5 } else if includes(["info", "information", "informational"], niveau_min3) { 9 } else if includes(["notice"], niveau_min3) { 10 } else if includes(["warn", "warning"], niveau_min3) { 13 } else if includes(["error", "err", "severe"], niveau_min3) { 17 } else if includes(["fatal", "critical", "crit", "alert", "emerg", "emergency", "panic", "dpanic"], niveau_min3) { 21 } else { 0 }
        lignes5 = split(string!(champs.msg), "\n", limit: 2)
        message4 = string(lignes5[0]) ?? ""
        .message = message4
        if length(lignes5) > 1 {
          trace6 = string(lignes5[1]) ?? ""
          .attributes."exception.stacktrace" = trace6
          exception7, exception_erreur7 = parse_regex(trace6, r'(?m)^(?:Caused by: )?(?P<type>(?:[A-Za-z_$][\w$]*\.)*[A-Za-z_$][\w$]*(?:Exception|Error|Throwable|Interrupt|Exit))(?::[ \t]*(?P<message>.*))?')
          if exception_erreur7 == null {
            .attributes."exception.type" = exception7.type
            if exception7.message != null {
              .attributes."exception.message" = exception7.message
            }
          }
        }
      }
sinks:
  sortie:
    type: console
    inputs: [analyse_python_logging]
    encoding:
      codec: json
tests:
  - name: 'reconnue : 2026-05-01 10:00:00,123 - facturation.worker - INFO - Traite…'
    inputs:
      - insert_at: analyse_python_logging
        type: log
        log_fields:
          message: '2026-05-01 10:00:00,123 - facturation.worker - INFO - Traitement du lot 77 (120 factures)'
    outputs:
      - extract_from: analyse_python_logging
        conditions:
          - type: vrl
            source: |
              assert_eq!(.attributes."log.record.original", "2026-05-01 10:00:00,123 - facturation.worker - INFO - Traitement du lot 77 (120 factures)")
              assert_eq!(.timestamp, t'2026-05-01T10:00:00.123Z')
              assert_eq!(.scope.name, "facturation.worker")
              assert_eq!(.severity_text, "INFO")
              assert_eq!(.severity_number, 9)
              assert_eq!(.message, "Traitement du lot 77 (120 factures)")
  - name: 'reconnue : 2026-05-01 10:00:00,456 - facturation.worker - WARNING - Fac…'
    inputs:
      - insert_at: analyse_python_logging
        type: log
        log_fields:
          message: '2026-05-01 10:00:00,456 - facturation.worker - WARNING - Facture 9001 sans adresse de livraison'
    outputs:
      - extract_from: analyse_python_logging
        conditions:
          - type: vrl
            source: |
              assert_eq!(.attributes."log.record.original", "2026-05-01 10:00:00,456 - facturation.worker - WARNING - Facture 9001 sans adresse de livraison")
              assert_eq!(.timestamp, t'2026-05-01T10:00:00.456Z')
              assert_eq!(.scope.name, "facturation.worker")
              assert_eq!(.severity_text, "WARNING")
              assert_eq!(.severity_number, 13)
              assert_eq!(.message, "Facture 9001 sans adresse de livraison")
  - name: 'reconnue : 2026-05-01 10:00:01,002 - facturation.export - ERROR - Expor…'
    inputs:
      - insert_at: analyse_python_logging
        type: log
        log_fields:
          message: |-
            2026-05-01 10:00:01,002 - facturation.export - ERROR - Export PDF impossible pour la facture 9002
            Traceback (most recent call last):
              File "/app/facturation/export.py", line 54, in rendre
                pdf = moteur.rendre(facture)
              File "/app/facturation/moteur.py", line 12, in rendre
                raise ValueError("gabarit introuvable : facture_v3")
            ValueError: gabarit introuvable : facture_v3
    outputs:
      - extract_from: analyse_python_logging
        conditions:
          - type: vrl
            source: |
              assert_eq!(.attributes."log.record.original", "2026-05-01 10:00:01,002 - facturation.export - ERROR - Export PDF impossible pour la facture 9002\nTraceback (most recent call last):\n  File \"/app/facturation/export.py\", line 54, in rendre\n    pdf = moteur.rendre(facture)\n  File \"/app/facturation/moteur.py\", line 12, in rendre\n    raise ValueError(\"gabarit introuvable : facture_v3\")\nValueError: gabarit introuvable : facture_v3")
              assert_eq!(.attributes."exception.stacktrace", "Traceback (most recent call last):\n  File \"/app/facturation/export.py\", line 54, in rendre\n    pdf = moteur.rendre(facture)\n  File \"/app/facturation/moteur.py\", line 12, in rendre\n    raise ValueError(\"gabarit introuvable : facture_v3\")\nValueError: gabarit introuvable : facture_v3")
              assert_eq!(.attributes."exception.type", "ValueError")
              assert_eq!(.attributes."exception.message", "gabarit introuvable : facture_v3")
              assert_eq!(.timestamp, t'2026-05-01T10:00:01.002Z')
              assert_eq!(.scope.name, "facturation.export")
              assert_eq!(.severity_text, "ERROR")
              assert_eq!(.severity_number, 17)
              assert_eq!(.message, "Export PDF impossible pour la facture 9002")
  - name: 'reconnue : 2026-05-01 10:00:02,000 - facturation.worker - DEBUG - Lot 7…'
    inputs:
      - insert_at: analyse_python_logging
        type: log
        log_fields:
          message: '2026-05-01 10:00:02,000 - facturation.worker - DEBUG - Lot 77 terminé'
    outputs:
      - extract_from: analyse_python_logging
        conditions:
          - type: vrl
            source: |
              assert_eq!(.attributes."log.record.original", "2026-05-01 10:00:02,000 - facturation.worker - DEBUG - Lot 77 terminé")
              assert_eq!(.timestamp, t'2026-05-01T10:00:02Z')
              assert_eq!(.scope.name, "facturation.worker")
              assert_eq!(.severity_text, "DEBUG")
              assert_eq!(.severity_number, 5)
              assert_eq!(.message, "Lot 77 terminé")
