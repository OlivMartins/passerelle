# Configuration Vector générée par Passerelle depuis un échantillon de journaux (Journal d’erreurs nginx)
# Tests : vector test <fichier> rejoue les 3 lignes de l’échantillon et vérifie chaque champ
# Essai : vector --config <fichier> < echantillon.log
# En production : remplacez la source « journaux » (file, kafka, journald, opentelemetry…) et la sortie « sortie »

sources:
  journaux:
    type: stdin
transforms:
  analyse_nginx_erreur:
    type: remap
    inputs: [journaux]
    source: |
      # Passerelle — analyse des lignes au format « Journal d’erreurs nginx »
      # Écrit à partir d’un échantillon de 3 événements (3 reconnus). Convention : OpenTelemetry.
      # Forme des événements de la source opentelemetry de Vector : .message (corps), .attributes, .resources, .severity_text.
      ligne = string(.message) ?? ""
      .attributes = object(.attributes) ?? {}
      .resources = object(.resources) ?? {}
      champs, erreur = parse_regex(ligne, r'^(?P<time>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?P<level>[a-z]+)\] (?P<pid>\d+)#(?P<tid>\d+): (?:\*(?P<cid>\d+) )?(?P<msg>[\s\S]*?)(?:, client: (?P<client>[^,]+))?(?:, server: (?P<server>[^,]*))?(?:, request: "(?P<method>[A-Z]+) (?P<path>[^\s?"]*)(?:\?(?P<query>[^\s"]*))? (?P<protocol>[A-Za-z]+)/(?P<pver>[0-9.]+)")?(?:, upstream: "(?P<upstream>[^"]*)")?(?:, host: "(?P<host>[^"]*)")?(?:, referrer: "(?P<referrer>[^"]*)")?\z')
      if erreur != null {
        .attributes."log.parse.error" = "ligne non reconnue : format « Journal d’erreurs nginx » attendu"
      } else {
        .attributes."log.record.original" = ligne
        horodatage1, erreur_horodatage1 = parse_timestamp(string!(champs.time), "%Y/%m/%d %H:%M:%S%.f", timezone: "UTC")
        if erreur_horodatage1 == null {
          .timestamp = horodatage1
        }
        niveau2 = string!(champs.level)
        .severity_text = niveau2
        niveau_min3 = downcase(niveau2)
        .severity_number = if includes(["trace", "finest", "finer", "trace1", "trace2", "trace3", "trace4", "trace5", "trace6", "trace7", "trace8"], niveau_min3) { 1 } else if includes(["debug", "fine", "dbg", "config", "verbose"], niveau_min3) { 5 } else if includes(["info", "information", "informational"], niveau_min3) { 9 } else if includes(["notice"], niveau_min3) { 10 } else if includes(["warn", "warning"], niveau_min3) { 13 } else if includes(["error", "err", "severe"], niveau_min3) { 17 } else if includes(["fatal", "critical", "crit", "alert", "emerg", "emergency", "panic", "dpanic"], niveau_min3) { 21 } else { 0 }
        .resources."process.pid" = to_int(champs.pid) ?? null
        .attributes."thread.id" = to_int(champs.tid) ?? null
        if champs.cid != null {
          .attributes."nginx.connection_id" = to_int(champs.cid) ?? null
        }
        message4 = string!(champs.msg)
        .message = message4
        if champs.client != null {
          .attributes."client.address" = champs.client
        }
        if champs.server != null && champs.server != "-" && champs.server != "" {
          .attributes."server.address" = champs.server
        }
        if champs.method != null {
          .attributes."http.request.method" = champs.method
        }
        if champs.path != null {
          .attributes."url.path" = champs.path
        }
        if champs.query != null && champs.query != "-" && champs.query != "" {
          .attributes."url.query" = champs.query
        }
        if champs.protocol != null {
          .attributes."network.protocol.name" = downcase(string!(champs.protocol))
        }
        if champs.pver != null {
          .attributes."network.protocol.version" = champs.pver
        }
        if champs.upstream != null {
          .attributes."nginx.upstream" = champs.upstream
        }
        if champs.host != null && champs.host != "-" && champs.host != "" {
          .attributes."http.request.header.host" = champs.host
        }
        if champs.referrer != null && champs.referrer != "-" && champs.referrer != "" {
          .attributes."http.request.header.referer" = champs.referrer
        }
      }
sinks:
  sortie:
    type: console
    inputs: [analyse_nginx_erreur]
    encoding:
      codec: json
tests:
  - name: 'reconnue : 2026/05/01 10:00:05 [error] 1234#1234: *5678 open() "/usr/sh…'
    inputs:
      - insert_at: analyse_nginx_erreur
        type: log
        log_fields:
          message: '2026/05/01 10:00:05 [error] 1234#1234: *5678 open() "/usr/share/nginx/html/robots.txt" failed (2: No such file or directory), client: 203.0.113.10, server: shop.example.com, request: "GET /robots.txt HTTP/1.1", host: "shop.example.com"'
    outputs:
      - extract_from: analyse_nginx_erreur
        conditions:
          - type: vrl
            source: |
              assert_eq!(.attributes."log.record.original", "2026/05/01 10:00:05 [error] 1234#1234: *5678 open() \"/usr/share/nginx/html/robots.txt\" failed (2: No such file or directory), client: 203.0.113.10, server: shop.example.com, request: \"GET /robots.txt HTTP/1.1\", host: \"shop.example.com\"")
              assert_eq!(.attributes."thread.id", 1234)
              assert_eq!(.attributes."nginx.connection_id", 5678)
              assert_eq!(.attributes."client.address", "203.0.113.10")
              assert_eq!(.attributes."server.address", "shop.example.com")
              assert_eq!(.attributes."http.request.method", "GET")
              assert_eq!(.attributes."url.path", "/robots.txt")
              assert_eq!(.attributes."network.protocol.name", "http")
              assert_eq!(.attributes."network.protocol.version", "1.1")
              assert_eq!(.attributes."http.request.header.host", "shop.example.com")
              assert_eq!(.resources."process.pid", 1234)
              assert_eq!(.timestamp, t'2026-05-01T10:00:05Z')
              assert_eq!(.severity_text, "error")
              assert_eq!(.severity_number, 17)
              assert_eq!(.message, "open() \"/usr/share/nginx/html/robots.txt\" failed (2: No such file or directory)")
  - name: 'reconnue : 2026/05/01 10:00:06 [warn] 1234#1234: *5679 an upstream resp…'
    inputs:
      - insert_at: analyse_nginx_erreur
        type: log
        log_fields:
          message: '2026/05/01 10:00:06 [warn] 1234#1234: *5679 an upstream response is buffered to a temporary file /var/cache/nginx/proxy_temp/1/00/0000000001 while reading upstream, client: 198.51.100.7, server: shop.example.com, request: "GET /api/export?format=csv HTTP/1.1", upstream: "http://10.0.2.15:8080/api/export?format=csv", host: "shop.example.com"'
    outputs:
      - extract_from: analyse_nginx_erreur
        conditions:
          - type: vrl
            source: |
              assert_eq!(.attributes."log.record.original", "2026/05/01 10:00:06 [warn] 1234#1234: *5679 an upstream response is buffered to a temporary file /var/cache/nginx/proxy_temp/1/00/0000000001 while reading upstream, client: 198.51.100.7, server: shop.example.com, request: \"GET /api/export?format=csv HTTP/1.1\", upstream: \"http://10.0.2.15:8080/api/export?format=csv\", host: \"shop.example.com\"")
              assert_eq!(.attributes."thread.id", 1234)
              assert_eq!(.attributes."nginx.connection_id", 5679)
              assert_eq!(.attributes."client.address", "198.51.100.7")
              assert_eq!(.attributes."server.address", "shop.example.com")
              assert_eq!(.attributes."http.request.method", "GET")
              assert_eq!(.attributes."url.path", "/api/export")
              assert_eq!(.attributes."url.query", "format=csv")
              assert_eq!(.attributes."network.protocol.name", "http")
              assert_eq!(.attributes."network.protocol.version", "1.1")
              assert_eq!(.attributes."nginx.upstream", "http://10.0.2.15:8080/api/export?format=csv")
              assert_eq!(.attributes."http.request.header.host", "shop.example.com")
              assert_eq!(.resources."process.pid", 1234)
              assert_eq!(.timestamp, t'2026-05-01T10:00:06Z')
              assert_eq!(.severity_text, "warn")
              assert_eq!(.severity_number, 13)
              assert_eq!(.message, "an upstream response is buffered to a temporary file /var/cache/nginx/proxy_temp/1/00/0000000001 while reading upstream")
  - name: 'reconnue : 2026/05/01 10:00:07 [notice] 1#1: signal process started'
    inputs:
      - insert_at: analyse_nginx_erreur
        type: log
        log_fields:
          message: '2026/05/01 10:00:07 [notice] 1#1: signal process started'
    outputs:
      - extract_from: analyse_nginx_erreur
        conditions:
          - type: vrl
            source: |
              assert_eq!(.attributes."log.record.original", "2026/05/01 10:00:07 [notice] 1#1: signal process started")
              assert_eq!(.attributes."thread.id", 1)
              assert_eq!(.resources."process.pid", 1)
              assert_eq!(.timestamp, t'2026-05-01T10:00:07Z')
              assert_eq!(.severity_text, "notice")
              assert_eq!(.severity_number, 10)
              assert_eq!(.message, "signal process started")
