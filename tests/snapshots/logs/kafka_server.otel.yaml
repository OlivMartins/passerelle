# Configuration Vector générée par Passerelle depuis un échantillon de journaux (Apache Kafka (log4j : [date] NIVEAU message (classe)))
# Tests : vector test <fichier> rejoue les 4 lignes de l’échantillon et vérifie chaque champ
# Essai : placez l’échantillon dans ./echantillon.log, créez /var/lib/vector, puis vector --config <fichier>
# En production : remplacez la source « journaux » (file, kafka, journald, opentelemetry…) et la sortie « sortie »

data_dir: /var/lib/vector
sources:
  journaux:
    type: file
    include: [./echantillon.log]
    read_from: beginning
    multiline:
      start_pattern: '^\[\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}\]'
      mode: halt_before
      condition_pattern: '^\[\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}\]'
      timeout_ms: 1000
transforms:
  analyse_kafka_server:
    type: remap
    inputs: [journaux]
    source: |
      # Passerelle — analyse des lignes au format « Apache Kafka (log4j : [date] NIVEAU message (classe)) »
      # Écrit à partir d’un échantillon de 4 événements (4 reconnus). Convention : OpenTelemetry.
      # Forme des événements de la source opentelemetry de Vector : .message (corps), .attributes, .resources, .severity_text.
      ligne = string(.message) ?? ""
      .attributes = object(.attributes) ?? {}
      .resources = object(.resources) ?? {}
      champs, erreur = parse_regex(ligne, r'^\[(?P<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3})\] (?P<level>TRACE|DEBUG|INFO|WARN|ERROR|FATAL) (?:\[(?P<component>[^\]]+)\] )?(?P<msg>[^\n]*?)(?: \((?P<logger>[^()\s]+)\))?(?P<stack>\n[\s\S]*)?\z')
      if erreur != null {
        .attributes."log.parse.error" = "ligne non reconnue : format « Apache Kafka (log4j : [date] NIVEAU message (classe)) » attendu"
      } else {
        .attributes."log.record.original" = ligne
        horodatage1, erreur_horodatage1 = parse_timestamp(replace(string!(champs.time), ",", "."), "%Y-%m-%d %H:%M:%S%.f", timezone: "UTC")
        if erreur_horodatage1 == null {
          .timestamp = horodatage1
        }
        niveau2 = string!(champs.level)
        .severity_text = niveau2
        niveau_min3 = downcase(niveau2)
        .severity_number = if includes(["trace", "finest", "finer", "trace1", "trace2", "trace3", "trace4", "trace5", "trace6", "trace7", "trace8"], niveau_min3) { 1 } else if includes(["debug", "fine", "dbg", "config", "verbose"], niveau_min3) { 5 } else if includes(["info", "information", "informational"], niveau_min3) { 9 } else if includes(["notice"], niveau_min3) { 10 } else if includes(["warn", "warning"], niveau_min3) { 13 } else if includes(["error", "err", "severe"], niveau_min3) { 17 } else if includes(["fatal", "critical", "crit", "alert", "emerg", "emergency", "panic", "dpanic"], niveau_min3) { 21 } else { 0 }
        if champs.component != null {
          .attributes."kafka.component" = champs.component
        }
        if champs.logger != null {
          .scope.name = champs.logger
        }
        message4 = string!(champs.msg)
        .message = message4
        if champs.stack != null {
          trace5 = strip_whitespace(string!(champs.stack))
          .attributes."exception.stacktrace" = trace5
          exception6, exception_erreur6 = parse_regex(trace5, r'(?m)^(?:Caused by: )?(?P<type>(?:[A-Za-z_$][\w$]*\.)*[A-Za-z_$][\w$]*(?:Exception|Error|Throwable|Interrupt|Exit))(?::[ \t]*(?P<message>.*))?')
          if exception_erreur6 == null {
            .attributes."exception.type" = exception6.type
            if exception6.message != null {
              .attributes."exception.message" = exception6.message
            }
          }
        }
      }
sinks:
  sortie:
    type: console
    inputs: [analyse_kafka_server]
    encoding:
      codec: json
tests:
  - name: 'reconnue : [2026-05-01 10:00:00,123] INFO [KafkaServer id=1] started (k…'
    inputs:
      - insert_at: analyse_kafka_server
        type: log
        log_fields:
          message: '[2026-05-01 10:00:00,123] INFO [KafkaServer id=1] started (kafka.server.KafkaServer)'
    outputs:
      - extract_from: analyse_kafka_server
        conditions:
          - type: vrl
            source: |
              assert_eq!(.attributes."log.record.original", "[2026-05-01 10:00:00,123] INFO [KafkaServer id=1] started (kafka.server.KafkaServer)")
              assert_eq!(.attributes."kafka.component", "KafkaServer id=1")
              assert_eq!(.timestamp, t'2026-05-01T10:00:00.123Z')
              assert_eq!(.severity_text, "INFO")
              assert_eq!(.severity_number, 9)
              assert_eq!(.scope.name, "kafka.server.KafkaServer")
              assert_eq!(.message, "started")
  - name: 'reconnue : [2026-05-01 10:00:01,456] INFO [Partition commandes-0 broker…'
    inputs:
      - insert_at: analyse_kafka_server
        type: log
        log_fields:
          message: '[2026-05-01 10:00:01,456] INFO [Partition commandes-0 broker=1] ISR updated to 1,2,3 and version updated to 7 (kafka.cluster.Partition)'
    outputs:
      - extract_from: analyse_kafka_server
        conditions:
          - type: vrl
            source: |
              assert_eq!(.attributes."log.record.original", "[2026-05-01 10:00:01,456] INFO [Partition commandes-0 broker=1] ISR updated to 1,2,3 and version updated to 7 (kafka.cluster.Partition)")
              assert_eq!(.attributes."kafka.component", "Partition commandes-0 broker=1")
              assert_eq!(.timestamp, t'2026-05-01T10:00:01.456Z')
              assert_eq!(.severity_text, "INFO")
              assert_eq!(.severity_number, 9)
              assert_eq!(.scope.name, "kafka.cluster.Partition")
              assert_eq!(.message, "ISR updated to 1,2,3 and version updated to 7")
  - name: 'reconnue : [2026-05-01 10:00:02,789] WARN [ReplicaFetcher replicaId=1, …'
    inputs:
      - insert_at: analyse_kafka_server
        type: log
        log_fields:
          message: '[2026-05-01 10:00:02,789] WARN [ReplicaFetcher replicaId=1, leaderId=2, fetcherId=0] Error in response for fetch request (kafka.server.ReplicaFetcherThread)'
    outputs:
      - extract_from: analyse_kafka_server
        conditions:
          - type: vrl
            source: |
              assert_eq!(.attributes."log.record.original", "[2026-05-01 10:00:02,789] WARN [ReplicaFetcher replicaId=1, leaderId=2, fetcherId=0] Error in response for fetch request (kafka.server.ReplicaFetcherThread)")
              assert_eq!(.attributes."kafka.component", "ReplicaFetcher replicaId=1, leaderId=2, fetcherId=0")
              assert_eq!(.timestamp, t'2026-05-01T10:00:02.789Z')
              assert_eq!(.severity_text, "WARN")
              assert_eq!(.severity_number, 13)
              assert_eq!(.scope.name, "kafka.server.ReplicaFetcherThread")
              assert_eq!(.message, "Error in response for fetch request")
  - name: 'reconnue : [2026-05-01 10:00:03,000] ERROR Uncaught exception in schedu…'
    inputs:
      - insert_at: analyse_kafka_server
        type: log
        log_fields:
          message: |-
            [2026-05-01 10:00:03,000] ERROR Uncaught exception in scheduled task 'flush-log' (org.apache.kafka.server.util.KafkaScheduler)
            java.io.IOException: No space left on device
            	at java.base/sun.nio.ch.FileDispatcherImpl.write0(Native Method)
    outputs:
      - extract_from: analyse_kafka_server
        conditions:
          - type: vrl
            source: |
              assert_eq!(.attributes."log.record.original", "[2026-05-01 10:00:03,000] ERROR Uncaught exception in scheduled task 'flush-log' (org.apache.kafka.server.util.KafkaScheduler)\njava.io.IOException: No space left on device\n\tat java.base/sun.nio.ch.FileDispatcherImpl.write0(Native Method)")
              assert_eq!(.attributes."exception.stacktrace", "java.io.IOException: No space left on device\n\tat java.base/sun.nio.ch.FileDispatcherImpl.write0(Native Method)")
              assert_eq!(.attributes."exception.type", "java.io.IOException")
              assert_eq!(.attributes."exception.message", "No space left on device")
              assert_eq!(.timestamp, t'2026-05-01T10:00:03Z')
              assert_eq!(.severity_text, "ERROR")
              assert_eq!(.severity_number, 17)
              assert_eq!(.scope.name, "org.apache.kafka.server.util.KafkaScheduler")
              assert_eq!(.message, "Uncaught exception in scheduled task 'flush-log'")
