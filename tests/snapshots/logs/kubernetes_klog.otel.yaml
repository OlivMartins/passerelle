# Configuration Vector générée par Passerelle depuis un échantillon de journaux (Go klog ou glog (Kubernetes))
# Tests : vector test <fichier> rejoue les 3 lignes de l’échantillon et vérifie chaque champ
# Essai : vector --config <fichier> < echantillon.log
# En production : remplacez la source « journaux » (file, kafka, journald, opentelemetry…) et la sortie « sortie »

sources:
  journaux:
    type: stdin
transforms:
  analyse_kubernetes_klog:
    type: remap
    inputs: [journaux]
    source: |
      # Passerelle — analyse des lignes au format « Go klog ou glog (Kubernetes) »
      # Écrit à partir d’un échantillon de 3 événements (3 reconnus). Convention : OpenTelemetry.
      # Forme des événements de la source opentelemetry de Vector : .message (corps), .attributes, .resources, .severity_text.
      ligne = string(.message) ?? ""
      .attributes = object(.attributes) ?? {}
      .resources = object(.resources) ?? {}
      # Le journal ne donne pas l’année : celle du jour, ou la précédente pour une date dans le futur
      annee = format_timestamp!(now(), "%Y", timezone: "UTC")
      champs, erreur = parse_regex(ligne, r'^(?P<level>[IWEF])(?P<time>\d{4} \d{2}:\d{2}:\d{2}\.\d+) +(?P<tid>\d+) (?P<file>[^:\s\]]+):(?P<line>\d+)\] (?P<msg>[\s\S]*)\z')
      if erreur != null {
        .attributes."log.parse.error" = "ligne non reconnue : format « Go klog ou glog (Kubernetes) » attendu"
      } else {
        .attributes."log.record.original" = ligne
        niveau1 = if champs.level == "I" { "INFO" } else if champs.level == "W" { "WARN" } else if champs.level == "E" { "ERROR" } else if champs.level == "F" { "FATAL" } else if champs.level == "D" { "DEBUG" } else if champs.level == "T" { "TRACE" } else { string!(champs.level) }
        .severity_text = niveau1
        niveau_min2 = downcase(niveau1)
        .severity_number = if includes(["trace", "finest", "finer", "trace1", "trace2", "trace3", "trace4", "trace5", "trace6", "trace7", "trace8"], niveau_min2) { 1 } else if includes(["debug", "fine", "dbg", "config", "verbose"], niveau_min2) { 5 } else if includes(["info", "information", "informational"], niveau_min2) { 9 } else if includes(["notice"], niveau_min2) { 10 } else if includes(["warn", "warning"], niveau_min2) { 13 } else if includes(["error", "err", "severe"], niveau_min2) { 17 } else if includes(["fatal", "critical", "crit", "alert", "emerg", "emergency", "panic", "dpanic"], niveau_min2) { 21 } else { 0 }
        horodatage3, erreur_horodatage3 = parse_timestamp(annee + " " + string!(champs.time), "%Y %m%d %H:%M:%S%.f", timezone: "UTC")
        if erreur_horodatage3 == null && to_unix_timestamp(horodatage3) > to_unix_timestamp(now()) + 86400 {
          # Date à plus d’un jour dans le futur : elle est de l’année précédente (journal de décembre lu en janvier)
          horodatage3 = parse_timestamp(to_string((to_int(annee) ?? 0) - 1) + " " + string!(champs.time), "%Y %m%d %H:%M:%S%.f", timezone: "UTC") ?? horodatage3
        }
        if erreur_horodatage3 == null {
          .timestamp = horodatage3
        }
        .attributes."thread.id" = to_int(champs.tid) ?? null
        .attributes."code.file.path" = champs.file
        .attributes."code.line.number" = to_int(champs.line) ?? null
        message4 = string!(champs.msg)
        .message = message4
        # Enrichissement : klog structuré ("message" clé=valeur…)
        detail5, detail_erreur5 = parse_regex(message4, r'^"(?P<m>(?:[^"\\]|\\.)*)"(?: (?P<kv>[\s\S]+))?\z')
        if detail_erreur5 == null {
          .message = parse_json("\"" + string!(detail5.m) + "\"") ?? detail5.m
          if detail5.kv != null {
            paires6 = parse_key_value(string!(detail5.kv), field_delimiter: " ", key_value_delimiter: "=") ?? {}
            .attributes = merge(.attributes, paires6)
          }
        }
      }
sinks:
  sortie:
    type: console
    inputs: [analyse_kubernetes_klog]
    encoding:
      codec: json
tests:
  - name: 'reconnue : I0501 10:00:00.123456       1 controller.go:211] "Synchronis…'
    inputs:
      - insert_at: analyse_kubernetes_klog
        type: log
        log_fields:
          message: 'I0501 10:00:00.123456       1 controller.go:211] "Synchronisation du déploiement" deployment="boutique/api" replicas=3'
    outputs:
      - extract_from: analyse_kubernetes_klog
        conditions:
          - type: vrl
            source: |
              assert_eq!(.attributes."log.record.original", "I0501 10:00:00.123456       1 controller.go:211] \"Synchronisation du déploiement\" deployment=\"boutique/api\" replicas=3")
              assert_eq!(.attributes."thread.id", 1)
              assert_eq!(.attributes."code.file.path", "controller.go")
              assert_eq!(.attributes."code.line.number", 211)
              assert_eq!(.attributes."deployment", "boutique/api")
              assert_eq!(.attributes."replicas", "3")
              assert_eq!(.severity_text, "INFO")
              assert_eq!(.severity_number, 9)
              assert_eq!(format_timestamp!(.timestamp, "%m-%dT%H:%M:%S%.9f", timezone: "UTC"), "05-01T10:00:00.123456000")
              assert_eq!(.message, "Synchronisation du déploiement")
  - name: 'reconnue : W0501 10:00:01.654321       1 reflector.go:539] client-go/in…'
    inputs:
      - insert_at: analyse_kubernetes_klog
        type: log
        log_fields:
          message: 'W0501 10:00:01.654321       1 reflector.go:539] client-go/informers: failed to list *v1.Pod: the server is currently unable to handle the request'
    outputs:
      - extract_from: analyse_kubernetes_klog
        conditions:
          - type: vrl
            source: |
              assert_eq!(.attributes."log.record.original", "W0501 10:00:01.654321       1 reflector.go:539] client-go/informers: failed to list *v1.Pod: the server is currently unable to handle the request")
              assert_eq!(.attributes."thread.id", 1)
              assert_eq!(.attributes."code.file.path", "reflector.go")
              assert_eq!(.attributes."code.line.number", 539)
              assert_eq!(.severity_text, "WARN")
              assert_eq!(.severity_number, 13)
              assert_eq!(format_timestamp!(.timestamp, "%m-%dT%H:%M:%S%.9f", timezone: "UTC"), "05-01T10:00:01.654321000")
              assert_eq!(.message, "client-go/informers: failed to list *v1.Pod: the server is currently unable to handle the request")
  - name: 'reconnue : E0501 10:00:02.000001      17 leaderelection.go:340] error r…'
    inputs:
      - insert_at: analyse_kubernetes_klog
        type: log
        log_fields:
          message: 'E0501 10:00:02.000001      17 leaderelection.go:340] error retrieving resource lock kube-system/kube-scheduler: context deadline exceeded'
    outputs:
      - extract_from: analyse_kubernetes_klog
        conditions:
          - type: vrl
            source: |
              assert_eq!(.attributes."log.record.original", "E0501 10:00:02.000001      17 leaderelection.go:340] error retrieving resource lock kube-system/kube-scheduler: context deadline exceeded")
              assert_eq!(.attributes."thread.id", 17)
              assert_eq!(.attributes."code.file.path", "leaderelection.go")
              assert_eq!(.attributes."code.line.number", 340)
              assert_eq!(.severity_text, "ERROR")
              assert_eq!(.severity_number, 17)
              assert_eq!(format_timestamp!(.timestamp, "%m-%dT%H:%M:%S%.9f", timezone: "UTC"), "05-01T10:00:02.000001000")
              assert_eq!(.message, "error retrieving resource lock kube-system/kube-scheduler: context deadline exceeded")
