# Configuration Vector générée par Passerelle depuis un échantillon de journaux (Linux auditd (audit.log))
# Tests : vector test <fichier> rejoue les 2 lignes de l’échantillon et vérifie chaque champ
# Essai : vector --config <fichier> < echantillon.log
# En production : remplacez la source « journaux » (file, kafka, journald, opentelemetry…) et la sortie « sortie »

sources:
  journaux:
    type: stdin
transforms:
  analyse_auditd:
    type: remap
    inputs: [journaux]
    source: |
      # Passerelle — analyse des lignes au format « Linux auditd (audit.log) »
      # Écrit à partir d’un échantillon de 2 événements (2 reconnus). Convention : OpenTelemetry.
      # Forme des événements de la source opentelemetry de Vector : .message (corps), .attributes, .resources, .severity_text.
      ligne = string(.message) ?? ""
      .attributes = object(.attributes) ?? {}
      .resources = object(.resources) ?? {}
      champs, erreur = parse_regex(ligne, r'^type=(?P<type>\S+) msg=audit\((?P<epoch>\d+\.\d+):(?P<serial>\d+)\): ?(?P<kv>[\s\S]*)\z')
      if erreur != null {
        .attributes."log.parse.error" = "ligne non reconnue : format « Linux auditd (audit.log) » attendu"
      } else {
        .attributes."auditd.record_type" = champs.type
        horodatage1, erreur_horodatage1 = parse_timestamp(string!(champs.epoch), "%s%.f")
        if erreur_horodatage1 == null {
          .timestamp = horodatage1
        }
        .attributes."auditd.sequence" = to_int(champs.serial) ?? null
        paires2 = parse_key_value(string!(champs.kv), field_delimiter: " ", key_value_delimiter: "=") ?? {}
        .attributes = merge(.attributes, map_keys(paires2) -> |cle| { "auditd." + cle })
      }
sinks:
  sortie:
    type: console
    inputs: [analyse_auditd]
    encoding:
      codec: json
tests:
  - name: 'reconnue : type=USER_START msg=audit(1777629600.123:4521): pid=2211 uid…'
    inputs:
      - insert_at: analyse_auditd
        type: log
        log_fields:
          message: 'type=USER_START msg=audit(1777629600.123:4521): pid=2211 uid=0 auid=1001 ses=12 subj=unconfined msg=''op=PAM:session_open grantors=pam_selinux,pam_loginuid acct="deploy" exe="/usr/sbin/sshd" hostname=198.51.100.20 addr=198.51.100.20 terminal=ssh res=success'''
    outputs:
      - extract_from: analyse_auditd
        conditions:
          - type: vrl
            source: |
              assert_eq!(.attributes."auditd.record_type", "USER_START")
              assert_eq!(.attributes."auditd.sequence", 4521)
              assert_eq!(.attributes."auditd.pid", "2211")
              assert_eq!(.attributes."auditd.uid", "0")
              assert_eq!(.attributes."auditd.auid", "1001")
              assert_eq!(.attributes."auditd.ses", "12")
              assert_eq!(.attributes."auditd.subj", "unconfined")
              assert_eq!(.attributes."auditd.msg", "op=PAM:session_open grantors=pam_selinux,pam_loginuid acct=\"deploy\" exe=\"/usr/sbin/sshd\" hostname=198.51.100.20 addr=198.51.100.20 terminal=ssh res=success")
              assert_eq!(.timestamp, t'2026-05-01T10:00:00.123Z')
  - name: 'reconnue : type=SYSCALL msg=audit(1777629601.456:4522): arch=c000003e s…'
    inputs:
      - insert_at: analyse_auditd
        type: log
        log_fields:
          message: 'type=SYSCALL msg=audit(1777629601.456:4522): arch=c000003e syscall=59 success=yes exit=0 a0=55d0 a1=55d1 a2=55d2 a3=8 items=2 ppid=2300 pid=2301 auid=1001 uid=0 gid=0 euid=0 comm="systemctl" exe="/usr/bin/systemctl" key="privileged"'
    outputs:
      - extract_from: analyse_auditd
        conditions:
          - type: vrl
            source: |
              assert_eq!(.attributes."auditd.record_type", "SYSCALL")
              assert_eq!(.attributes."auditd.sequence", 4522)
              assert_eq!(.attributes."auditd.arch", "c000003e")
              assert_eq!(.attributes."auditd.syscall", "59")
              assert_eq!(.attributes."auditd.success", "yes")
              assert_eq!(.attributes."auditd.exit", "0")
              assert_eq!(.attributes."auditd.a0", "55d0")
              assert_eq!(.attributes."auditd.a1", "55d1")
              assert_eq!(.attributes."auditd.a2", "55d2")
              assert_eq!(.attributes."auditd.a3", "8")
              assert_eq!(.attributes."auditd.items", "2")
              assert_eq!(.attributes."auditd.ppid", "2300")
              assert_eq!(.attributes."auditd.pid", "2301")
              assert_eq!(.attributes."auditd.auid", "1001")
              assert_eq!(.attributes."auditd.uid", "0")
              assert_eq!(.attributes."auditd.gid", "0")
              assert_eq!(.attributes."auditd.euid", "0")
              assert_eq!(.attributes."auditd.comm", "systemctl")
              assert_eq!(.attributes."auditd.exe", "/usr/bin/systemctl")
              assert_eq!(.attributes."auditd.key", "privileged")
              assert_eq!(.timestamp, t'2026-05-01T10:00:01.456Z')
