# Configuration Vector générée par Passerelle depuis un échantillon de journaux (JSON — HashiCorp hclog (Nomad, Vault, Consul en -log-json))
# Tests : vector test <fichier> rejoue les 2 lignes de l’échantillon et vérifie chaque champ
# Essai : vector --config <fichier> < echantillon.log
# En production : remplacez la source « journaux » (file, kafka, journald, opentelemetry…) et la sortie « sortie »

sources:
  journaux:
    type: stdin
transforms:
  analyse_nomad_json:
    type: remap
    inputs: [journaux]
    source: |
      # Passerelle — analyse des lignes au format « JSON — HashiCorp hclog (Nomad, Vault, Consul en -log-json) »
      # Écrit à partir d’un échantillon de 2 événements (2 reconnus). Convention : ECS (Elastic Common Schema).
      ligne = string(.message) ?? ""
      objet, erreur = parse_json(ligne)
      if erreur != null || !is_object(objet) {
        .error.message = "ligne non reconnue : un objet JSON attendu"
        .tags = push(array(.tags) ?? [], "_vrl_parse_failure")
      } else {
        .event.original = ligne
        champs = flatten(object!(objet))
        # Horodatage : clé "@timestamp"
        if exists(champs."@timestamp") {
          horodatage1, erreur_horodatage1 = parse_timestamp(string(champs."@timestamp") ?? "", "%Y-%m-%dT%H:%M:%S%.f%#z")
          if erreur_horodatage1 == null {
            ."@timestamp" = horodatage1
            del(.timestamp)
          }
          del(champs."@timestamp")
        }
        # Niveau : clé "@level"
        if exists(champs."@level") {
          niveau2 = string(champs."@level") ?? ""
          .log.level = niveau2
          del(champs."@level")
        }
        # Message : clé "@message"
        if exists(champs."@message") {
          .message = champs."@message"
          del(champs."@message")
        }
        # Rôle logger : clé "@module"
        if exists(champs."@module") {
          .log.logger = champs."@module"
          del(champs."@module")
        }
        # Les autres clés sont recopiées à la racine de l’événement
        . = merge(., unflatten(champs), deep: true)
      }
sinks:
  sortie:
    type: console
    inputs: [analyse_nomad_json]
    encoding:
      codec: json
tests:
  - name: 'reconnue : {"@level":"info","@message":"Task event","@module":"client.a…'
    inputs:
      - insert_at: analyse_nomad_json
        type: log
        log_fields:
          message: '{"@level":"info","@message":"Task event","@module":"client.alloc_runner.task_runner","@timestamp":"2026-05-01T10:00:01.456789+02:00","alloc_id":"1b2c3d4e-5f60-7182-93a4-b5c6d7e8f901","failed":false,"msg":"Task started by client","task":"redis","type":"Started"}'
    outputs:
      - extract_from: analyse_nomad_json
        conditions:
          - type: vrl
            source: |
              assert_eq!(.event.original, "{\"@level\":\"info\",\"@message\":\"Task event\",\"@module\":\"client.alloc_runner.task_runner\",\"@timestamp\":\"2026-05-01T10:00:01.456789+02:00\",\"alloc_id\":\"1b2c3d4e-5f60-7182-93a4-b5c6d7e8f901\",\"failed\":false,\"msg\":\"Task started by client\",\"task\":\"redis\",\"type\":\"Started\"}")
              assert_eq!(."@timestamp", t'2026-05-01T08:00:01.456789Z')
              assert_eq!(.log.level, "info")
              assert_eq!(.log.logger, "client.alloc_runner.task_runner")
              assert_eq!(.message, "Task event")
              assert_eq!(.alloc_id, "1b2c3d4e-5f60-7182-93a4-b5c6d7e8f901")
              assert_eq!(.failed, false)
              assert_eq!(.msg, "Task started by client")
              assert_eq!(.task, "redis")
              assert_eq!(.type, "Started")
  - name: 'reconnue : {"@level":"error","@message":"yamux: keepalive failed: i/o d…'
    inputs:
      - insert_at: analyse_nomad_json
        type: log
        log_fields:
          message: '{"@level":"error","@message":"yamux: keepalive failed: i/o deadline reached","@module":"nomad.rpc","@timestamp":"2026-05-01T10:00:03.000000+02:00"}'
    outputs:
      - extract_from: analyse_nomad_json
        conditions:
          - type: vrl
            source: |
              assert_eq!(.event.original, "{\"@level\":\"error\",\"@message\":\"yamux: keepalive failed: i/o deadline reached\",\"@module\":\"nomad.rpc\",\"@timestamp\":\"2026-05-01T10:00:03.000000+02:00\"}")
              assert_eq!(."@timestamp", t'2026-05-01T08:00:03Z')
              assert_eq!(.log.level, "error")
              assert_eq!(.log.logger, "nomad.rpc")
              assert_eq!(.message, "yamux: keepalive failed: i/o deadline reached")
