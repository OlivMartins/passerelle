# Configuration Vector générée par Passerelle depuis un échantillon de journaux (JSON — HashiCorp hclog (Nomad, Vault, Consul en -log-json))
# Tests : vector test <fichier> rejoue les 2 lignes de l’échantillon et vérifie chaque champ
# Essai : vector --config <fichier> < echantillon.log
# En production : remplacez la source « journaux » (file, kafka, journald, opentelemetry…) et la sortie « sortie »

sources:
  journaux:
    type: stdin
transforms:
  analyse_nomad_json:
    type: remap
    inputs: [journaux]
    source: |
      # Passerelle — analyse des lignes au format « JSON — HashiCorp hclog (Nomad, Vault, Consul en -log-json) »
      # Écrit à partir d’un échantillon de 2 événements (2 reconnus). Convention : OpenTelemetry.
      # Forme des événements de la source opentelemetry de Vector : .message (corps), .attributes, .resources, .severity_text.
      ligne = string(.message) ?? ""
      .attributes = object(.attributes) ?? {}
      .resources = object(.resources) ?? {}
      objet, erreur = parse_json(ligne)
      if erreur != null || !is_object(objet) {
        .attributes."log.parse.error" = "ligne non reconnue : un objet JSON attendu"
      } else {
        .attributes."log.record.original" = ligne
        champs = flatten(object!(objet))
        # Horodatage : clé "@timestamp"
        if exists(champs."@timestamp") {
          horodatage1, erreur_horodatage1 = parse_timestamp(string(champs."@timestamp") ?? "", "%Y-%m-%dT%H:%M:%S%.f%#z")
          if erreur_horodatage1 == null {
            .timestamp = horodatage1
          }
          del(champs."@timestamp")
        }
        # Niveau : clé "@level"
        if exists(champs."@level") {
          niveau2 = string(champs."@level") ?? ""
          .severity_text = niveau2
          niveau_min3 = downcase(niveau2)
          .severity_number = if includes(["trace", "finest", "finer", "trace1", "trace2", "trace3", "trace4", "trace5", "trace6", "trace7", "trace8"], niveau_min3) { 1 } else if includes(["debug", "fine", "dbg", "config", "verbose"], niveau_min3) { 5 } else if includes(["info", "information", "informational"], niveau_min3) { 9 } else if includes(["notice"], niveau_min3) { 10 } else if includes(["warn", "warning"], niveau_min3) { 13 } else if includes(["error", "err", "severe"], niveau_min3) { 17 } else if includes(["fatal", "critical", "crit", "alert", "emerg", "emergency", "panic", "dpanic"], niveau_min3) { 21 } else { 0 }
          del(champs."@level")
        }
        # Message : clé "@message"
        if exists(champs."@message") {
          .message = champs."@message"
          del(champs."@message")
        }
        # Rôle logger : clé "@module"
        if exists(champs."@module") {
          .scope.name = champs."@module"
          del(champs."@module")
        }
        # Les autres clés deviennent des attributs
        .attributes = merge(.attributes, champs)
      }
sinks:
  sortie:
    type: console
    inputs: [analyse_nomad_json]
    encoding:
      codec: json
tests:
  - name: 'reconnue : {"@level":"info","@message":"Task event","@module":"client.a…'
    inputs:
      - insert_at: analyse_nomad_json
        type: log
        log_fields:
          message: '{"@level":"info","@message":"Task event","@module":"client.alloc_runner.task_runner","@timestamp":"2026-05-01T10:00:01.456789+02:00","alloc_id":"1b2c3d4e-5f60-7182-93a4-b5c6d7e8f901","failed":false,"msg":"Task started by client","task":"redis","type":"Started"}'
    outputs:
      - extract_from: analyse_nomad_json
        conditions:
          - type: vrl
            source: |
              assert_eq!(.attributes."log.record.original", "{\"@level\":\"info\",\"@message\":\"Task event\",\"@module\":\"client.alloc_runner.task_runner\",\"@timestamp\":\"2026-05-01T10:00:01.456789+02:00\",\"alloc_id\":\"1b2c3d4e-5f60-7182-93a4-b5c6d7e8f901\",\"failed\":false,\"msg\":\"Task started by client\",\"task\":\"redis\",\"type\":\"Started\"}")
              assert_eq!(.attributes."alloc_id", "1b2c3d4e-5f60-7182-93a4-b5c6d7e8f901")
              assert_eq!(.attributes."failed", false)
              assert_eq!(.attributes."msg", "Task started by client")
              assert_eq!(.attributes."task", "redis")
              assert_eq!(.attributes."type", "Started")
              assert_eq!(.timestamp, t'2026-05-01T08:00:01.456789Z')
              assert_eq!(.severity_text, "info")
              assert_eq!(.severity_number, 9)
              assert_eq!(.message, "Task event")
              assert_eq!(.scope.name, "client.alloc_runner.task_runner")
  - name: 'reconnue : {"@level":"error","@message":"yamux: keepalive failed: i/o d…'
    inputs:
      - insert_at: analyse_nomad_json
        type: log
        log_fields:
          message: '{"@level":"error","@message":"yamux: keepalive failed: i/o deadline reached","@module":"nomad.rpc","@timestamp":"2026-05-01T10:00:03.000000+02:00"}'
    outputs:
      - extract_from: analyse_nomad_json
        conditions:
          - type: vrl
            source: |
              assert_eq!(.attributes."log.record.original", "{\"@level\":\"error\",\"@message\":\"yamux: keepalive failed: i/o deadline reached\",\"@module\":\"nomad.rpc\",\"@timestamp\":\"2026-05-01T10:00:03.000000+02:00\"}")
              assert_eq!(.timestamp, t'2026-05-01T08:00:03Z')
              assert_eq!(.severity_text, "error")
              assert_eq!(.severity_number, 17)
              assert_eq!(.message, "yamux: keepalive failed: i/o deadline reached")
              assert_eq!(.scope.name, "nomad.rpc")
