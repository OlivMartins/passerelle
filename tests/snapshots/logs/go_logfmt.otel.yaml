# Configuration Vector générée par Passerelle depuis un échantillon de journaux (logfmt (clé=valeur))
# Tests : vector test <fichier> rejoue les 3 lignes de l’échantillon et vérifie chaque champ
# Essai : vector --config <fichier> < echantillon.log
# En production : remplacez la source « journaux » (file, kafka, journald, opentelemetry…) et la sortie « sortie »

sources:
  journaux:
    type: stdin
transforms:
  analyse_go_logfmt:
    type: remap
    inputs: [journaux]
    source: |
      # Passerelle — analyse des lignes au format « logfmt (clé=valeur) »
      # Écrit à partir d’un échantillon de 3 événements (3 reconnus). Convention : OpenTelemetry.
      # Forme des événements de la source opentelemetry de Vector : .message (corps), .attributes, .resources, .severity_text.
      ligne = string(.message) ?? ""
      .attributes = object(.attributes) ?? {}
      .resources = object(.resources) ?? {}
      objet, erreur = parse_logfmt(ligne)
      if erreur != null {
        .attributes."log.parse.error" = "ligne non reconnue : des paires clé=valeur (logfmt) attendu"
      } else {
        .attributes."log.record.original" = ligne
        champs = objet
        # Horodatage : clé "time"
        if exists(champs."time") {
          horodatage1, erreur_horodatage1 = parse_timestamp(string(champs."time") ?? "", "%Y-%m-%dT%H:%M:%S%.f%#z")
          if erreur_horodatage1 == null {
            .timestamp = horodatage1
          }
          del(champs."time")
        }
        # Niveau : clé "level"
        if exists(champs."level") {
          niveau2 = string(champs."level") ?? ""
          .severity_text = niveau2
          niveau_min3 = downcase(niveau2)
          .severity_number = if includes(["trace", "finest", "finer", "trace1", "trace2", "trace3", "trace4", "trace5", "trace6", "trace7", "trace8"], niveau_min3) { 1 } else if includes(["debug", "fine", "dbg", "config", "verbose"], niveau_min3) { 5 } else if includes(["info", "information", "informational"], niveau_min3) { 9 } else if includes(["notice"], niveau_min3) { 10 } else if includes(["warn", "warning"], niveau_min3) { 13 } else if includes(["error", "err", "severe"], niveau_min3) { 17 } else if includes(["fatal", "critical", "crit", "alert", "emerg", "emergency", "panic", "dpanic"], niveau_min3) { 21 } else { 0 }
          del(champs."level")
        }
        # Message : clé "msg"
        if exists(champs."msg") {
          .message = champs."msg"
          del(champs."msg")
        }
        # Rôle trace_id : clé "trace_id"
        if exists(champs."trace_id") {
          .trace_id = champs."trace_id"
          del(champs."trace_id")
        }
        # Rôle exc_message : clé "err"
        if exists(champs."err") {
          .attributes."exception.message" = champs."err"
          del(champs."err")
        }
        # Les autres clés deviennent des attributs
        .attributes = merge(.attributes, champs)
      }
sinks:
  sortie:
    type: console
    inputs: [analyse_go_logfmt]
    encoding:
      codec: json
tests:
  - name: 'reconnue : time=2026-05-01T10:00:00.000+02:00 level=INFO msg="serveur d…'
    inputs:
      - insert_at: analyse_go_logfmt
        type: log
        log_fields:
          message: time=2026-05-01T10:00:00.000+02:00 level=INFO msg="serveur démarré" addr=:8080 version=1.4.2
    outputs:
      - extract_from: analyse_go_logfmt
        conditions:
          - type: vrl
            source: |
              assert_eq!(.attributes."log.record.original", "time=2026-05-01T10:00:00.000+02:00 level=INFO msg=\"serveur démarré\" addr=:8080 version=1.4.2")
              assert_eq!(.attributes."addr", ":8080")
              assert_eq!(.attributes."version", "1.4.2")
              assert_eq!(.timestamp, t'2026-05-01T08:00:00Z')
              assert_eq!(.severity_text, "INFO")
              assert_eq!(.severity_number, 9)
              assert_eq!(.message, "serveur démarré")
  - name: 'reconnue : time=2026-05-01T10:00:01.250+02:00 level=WARN msg="latence é…'
    inputs:
      - insert_at: analyse_go_logfmt
        type: log
        log_fields:
          message: time=2026-05-01T10:00:01.250+02:00 level=WARN msg="latence élevée" route=/api/stock duree_ms=812 tentative=2
    outputs:
      - extract_from: analyse_go_logfmt
        conditions:
          - type: vrl
            source: |
              assert_eq!(.attributes."log.record.original", "time=2026-05-01T10:00:01.250+02:00 level=WARN msg=\"latence élevée\" route=/api/stock duree_ms=812 tentative=2")
              assert_eq!(.attributes."route", "/api/stock")
              assert_eq!(.attributes."duree_ms", "812")
              assert_eq!(.attributes."tentative", "2")
              assert_eq!(.timestamp, t'2026-05-01T08:00:01.25Z')
              assert_eq!(.severity_text, "WARN")
              assert_eq!(.severity_number, 13)
              assert_eq!(.message, "latence élevée")
  - name: 'reconnue : time=2026-05-01T10:00:02.500+02:00 level=ERROR msg="échec de…'
    inputs:
      - insert_at: analyse_go_logfmt
        type: log
        log_fields:
          message: time=2026-05-01T10:00:02.500+02:00 level=ERROR msg="échec de la requête" route=/api/paiement err="context deadline exceeded" trace_id=4bf92f3577b34da6a3ce929d0e0e4736
    outputs:
      - extract_from: analyse_go_logfmt
        conditions:
          - type: vrl
            source: |
              assert_eq!(.attributes."log.record.original", "time=2026-05-01T10:00:02.500+02:00 level=ERROR msg=\"échec de la requête\" route=/api/paiement err=\"context deadline exceeded\" trace_id=4bf92f3577b34da6a3ce929d0e0e4736")
              assert_eq!(.attributes."exception.message", "context deadline exceeded")
              assert_eq!(.attributes."route", "/api/paiement")
              assert_eq!(.timestamp, t'2026-05-01T08:00:02.5Z')
              assert_eq!(.severity_text, "ERROR")
              assert_eq!(.severity_number, 17)
              assert_eq!(.message, "échec de la requête")
              assert_eq!(.trace_id, "4bf92f3577b34da6a3ce929d0e0e4736")
