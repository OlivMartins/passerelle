# Configuration Vector générée par Passerelle depuis un échantillon de journaux (JSON — ClickHouse (format JSON du serveur))
# Tests : vector test <fichier> rejoue les 2 lignes de l’échantillon et vérifie chaque champ
# Essai : vector --config <fichier> < echantillon.log
# En production : remplacez la source « journaux » (file, kafka, journald, opentelemetry…) et la sortie « sortie »

sources:
  journaux:
    type: stdin
transforms:
  analyse_clickhouse_json:
    type: remap
    inputs: [journaux]
    source: |
      # Passerelle — analyse des lignes au format « JSON — ClickHouse (format JSON du serveur) »
      # Écrit à partir d’un échantillon de 2 événements (2 reconnus). Convention : OpenTelemetry.
      # Forme des événements de la source opentelemetry de Vector : .message (corps), .attributes, .resources, .severity_text.
      ligne = string(.message) ?? ""
      .attributes = object(.attributes) ?? {}
      .resources = object(.resources) ?? {}
      objet, erreur = parse_json(ligne)
      if erreur != null || !is_object(objet) {
        .attributes."log.parse.error" = "ligne non reconnue : un objet JSON attendu"
      } else {
        .attributes."log.record.original" = ligne
        champs = flatten(object!(objet))
        # Horodatage : clé "date_time"
        if exists(champs."date_time") {
          horodatage1, erreur_horodatage1 = parse_timestamp(string(champs."date_time") ?? "", "%s%.f")
          if erreur_horodatage1 == null {
            .timestamp = horodatage1
          }
          del(champs."date_time")
        }
        # Niveau : clé "level"
        if exists(champs."level") {
          niveau2 = string(champs."level") ?? ""
          .severity_text = niveau2
          niveau_min3 = downcase(niveau2)
          .severity_number = if includes(["trace", "finest", "finer", "trace1", "trace2", "trace3", "trace4", "trace5", "trace6", "trace7", "trace8"], niveau_min3) { 1 } else if includes(["debug", "fine", "dbg", "config", "verbose"], niveau_min3) { 5 } else if includes(["info", "information", "informational"], niveau_min3) { 9 } else if includes(["notice"], niveau_min3) { 10 } else if includes(["warn", "warning"], niveau_min3) { 13 } else if includes(["error", "err", "severe"], niveau_min3) { 17 } else if includes(["fatal", "critical", "crit", "alert", "emerg", "emergency", "panic", "dpanic"], niveau_min3) { 21 } else { 0 }
          del(champs."level")
        }
        # Message : clé "message"
        if exists(champs."message") {
          .message = champs."message"
          del(champs."message")
        }
        # Rôle logger : clé "logger_name"
        if exists(champs."logger_name") {
          .scope.name = champs."logger_name"
          del(champs."logger_name")
        }
        # Rôle thread : clé "thread_name"
        if exists(champs."thread_name") {
          .attributes."thread.name" = champs."thread_name"
          del(champs."thread_name")
        }
        # Les autres clés deviennent des attributs
        .attributes = merge(.attributes, champs)
      }
sinks:
  sortie:
    type: console
    inputs: [analyse_clickhouse_json]
    encoding:
      codec: json
tests:
  - name: 'reconnue : {"date_time_utc":"2026-05-01T10:00:00Z","date_time":"1777629…'
    inputs:
      - insert_at: analyse_clickhouse_json
        type: log
        log_fields:
          message: '{"date_time_utc":"2026-05-01T10:00:00Z","date_time":"1777629600.123456","thread_name":"","thread_id":"4242","level":"Information","query_id":"","logger_name":"Application","message":"Ready for connections.","source_file":"programs/server/Server.cpp; virtual int DB::Server::main(const std::vector<std::string> &)","source_line":"2234"}'
    outputs:
      - extract_from: analyse_clickhouse_json
        conditions:
          - type: vrl
            source: |
              assert_eq!(.attributes."log.record.original", "{\"date_time_utc\":\"2026-05-01T10:00:00Z\",\"date_time\":\"1777629600.123456\",\"thread_name\":\"\",\"thread_id\":\"4242\",\"level\":\"Information\",\"query_id\":\"\",\"logger_name\":\"Application\",\"message\":\"Ready for connections.\",\"source_file\":\"programs/server/Server.cpp; virtual int DB::Server::main(const std::vector<std::string> &)\",\"source_line\":\"2234\"}")
              assert_eq!(.attributes."thread.name", "")
              assert_eq!(.attributes."date_time_utc", "2026-05-01T10:00:00Z")
              assert_eq!(.attributes."thread_id", "4242")
              assert_eq!(.attributes."query_id", "")
              assert_eq!(.attributes."source_file", "programs/server/Server.cpp; virtual int DB::Server::main(const std::vector<std::string> &)")
              assert_eq!(.attributes."source_line", "2234")
              assert_eq!(.timestamp, t'2026-05-01T10:00:00.123456Z')
              assert_eq!(.severity_text, "Information")
              assert_eq!(.severity_number, 9)
              assert_eq!(.message, "Ready for connections.")
              assert_eq!(.scope.name, "Application")
  - name: 'reconnue : {"date_time_utc":"2026-05-01T10:00:01Z","date_time":"1777629…'
    inputs:
      - insert_at: analyse_clickhouse_json
        type: log
        log_fields:
          message: '{"date_time_utc":"2026-05-01T10:00:01Z","date_time":"1777629601.345678","thread_name":"TCPHandler","thread_id":"4250","level":"Error","query_id":"9f1c2d3e-0a4b-4c5d-8e6f-7a8b9c0d1e2f","logger_name":"executeQuery","message":"Code: 60. DB::Exception: Table logs.evenements does not exist. (UNKNOWN_TABLE)","source_file":"src/Interpreters/executeQuery.cpp; void DB::logException(ContextPtr, QueryLogElement &, bool)","source_line":"221"}'
    outputs:
      - extract_from: analyse_clickhouse_json
        conditions:
          - type: vrl
            source: |
              assert_eq!(.attributes."log.record.original", "{\"date_time_utc\":\"2026-05-01T10:00:01Z\",\"date_time\":\"1777629601.345678\",\"thread_name\":\"TCPHandler\",\"thread_id\":\"4250\",\"level\":\"Error\",\"query_id\":\"9f1c2d3e-0a4b-4c5d-8e6f-7a8b9c0d1e2f\",\"logger_name\":\"executeQuery\",\"message\":\"Code: 60. DB::Exception: Table logs.evenements does not exist. (UNKNOWN_TABLE)\",\"source_file\":\"src/Interpreters/executeQuery.cpp; void DB::logException(ContextPtr, QueryLogElement &, bool)\",\"source_line\":\"221\"}")
              assert_eq!(.attributes."thread.name", "TCPHandler")
              assert_eq!(.attributes."date_time_utc", "2026-05-01T10:00:01Z")
              assert_eq!(.attributes."thread_id", "4250")
              assert_eq!(.attributes."query_id", "9f1c2d3e-0a4b-4c5d-8e6f-7a8b9c0d1e2f")
              assert_eq!(.attributes."source_file", "src/Interpreters/executeQuery.cpp; void DB::logException(ContextPtr, QueryLogElement &, bool)")
              assert_eq!(.attributes."source_line", "221")
              assert_eq!(.timestamp, t'2026-05-01T10:00:01.345678Z')
              assert_eq!(.severity_text, "Error")
              assert_eq!(.severity_number, 17)
              assert_eq!(.message, "Code: 60. DB::Exception: Table logs.evenements does not exist. (UNKNOWN_TABLE)")
              assert_eq!(.scope.name, "executeQuery")
