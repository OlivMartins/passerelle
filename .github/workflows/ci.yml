name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Appelé par release.yml : une release n'est construite qu'après les mêmes preuves que main
  workflow_call:
    inputs:
      ref:
        description: Révision à tester (étiquette de la release)
        required: false
        type: string

permissions:
  contents: read

jobs:
  tests:
    name: Tests et interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !inputs.ref }}
        with:
          name: passerelle-html
          path: dist/passerelle.html

  # Le README annonce trois versions majeures d'Elasticsearch : chacune est jouée, à chaque changement
  differentiel:
    name: Banc différentiel Elasticsearch ${{ matrix.es }} / ClickHouse
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        es: ['7.17.29', '8.19.22', '9.5.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Démarrer Elasticsearch ${{ matrix.es }}
        env:
          ES_VERSION: ${{ matrix.es }}
        run: sh tests/differential/es.sh up
      - name: Extraire le binaire ClickHouse 26.9 de son image officielle
        run: sh tests/differential/clickhouse.sh 26.9 ./clickhouse
      - name: Comparer les résultats
        env:
          CLICKHOUSE_LOCAL: ${{ github.workspace }}/clickhouse local
        shell: bash
        run: |
          # Les écarts sont aussi publiés en annotations : lisibles sans télécharger le journal
          set -o pipefail
          npm run test:diff 2>&1 | tee diff.log || {
            status=$?
            grep -E -A2 'ÉCHEC|^Bilan|^Échecs' diff.log | head -60 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit "$status"
          }

  # Sans Elasticsearch : les attributs (Map, JSON) donnent le résultat de la table plate, et ce que Passerelle
  # génère pour ses exemples (schéma, inventaire Kibana) s'exécute sur ClickHouse avec les valeurs attendues
  clickhouse:
    name: Bancs ClickHouse (attributs, schéma, inventaire Kibana)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Extraire le binaire ClickHouse 26.9 de son image officielle
        run: sh tests/differential/clickhouse.sh 26.9 ./clickhouse
      - name: Attributs OpenTelemetry
        env:
          CLICKHOUSE_LOCAL: ${{ github.workspace }}/clickhouse local
        run: npm run test:attributes
      - name: Schéma et inventaire Kibana
        env:
          CLICKHOUSE_LOCAL: ${{ github.workspace }}/clickhouse local
        run: npm run test:clickhouse

  # Le VRL des pipelines d'ingestion traduits doit compiler : Vector refuse sinon la configuration entière,
  # quel que soit le verdict de Passerelle
  ingest:
    name: Compilation du VRL des pipelines d'ingestion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Installer Vector 0.59.0
        run: |
          curl -fsSL https://github.com/vectordotdev/vector/releases/download/v0.59.0/vector-0.59.0-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "VECTOR_BIN=$(ls "$RUNNER_TEMP"/vector-x86_64-unknown-linux-gnu/bin/vector)" >> "$GITHUB_ENV"
      - name: Récupérer les intégrations Elastic et les bases GeoLite2 de test
        run: |
          git init -q "$RUNNER_TEMP/integrations" && cd "$RUNNER_TEMP/integrations"
          git remote add origin https://github.com/elastic/integrations
          git sparse-checkout set packages/admin_by_request_epm packages/apache packages/auditd packages/aws packages/nginx packages/system
          git fetch -q --depth 1 --filter=blob:none origin ec998de916b70ef0ad702606a2813ce2965f296b && git checkout -q FETCH_HEAD
          git init -q "$RUNNER_TEMP/maxmind" && cd "$RUNNER_TEMP/maxmind"
          git remote add origin https://github.com/maxmind/MaxMind-DB
          git fetch -q --depth 1 origin d1551916cff0712d12ff602c309234471b0402a2 && git checkout -q FETCH_HEAD
          echo "ELASTIC_INTEGRATIONS=$RUNNER_TEMP/integrations" >> "$GITHUB_ENV"
          echo "MAXMIND_TEST_DATA=$RUNNER_TEMP/maxmind/test-data" >> "$GITHUB_ENV"
      - name: Compiler le VRL (sortie console)
        run: node tests/ingest/valider.mjs
      - name: Compiler le VRL (sortie ClickHouse)
        run: node tests/ingest/valider.mjs --clickhouse
      - name: TLS des sources qui écoutent (handshake réel)
        run: node tests/ingest/tls.mjs

  # L'interface ouverte dans un vrai navigateur : chaque section traduit son exemple, sans erreur de page
  interface:
    name: Interface dans Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build:ui
      - name: Installer Playwright et Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: npm run test:ui

  pipelines:
    name: Banc d'équivalence Logstash / Vector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Comparer les événements
        env:
          LOGSTASH_VERSION: 9.5.5
          VECTOR_VERSION: 0.59.0
        run: npm run test:pipelines

  image:
    name: Image conteneur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - name: Construire l'image
        run: docker build -t passerelle:ci .
      - name: Démarrer et traduire une requête
        run: |
          docker run -d --name passerelle -p 127.0.0.1:8080:8080 --read-only --tmpfs /tmp passerelle:ci
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS -X POST "http://127.0.0.1:8080/v1/translate/dsl?index=logs-*" \
            --data-binary '{"query":{"term":{"service":"api"}}}' | grep -q '"verdict"'
      - name: Journal du conteneur
        if: failure()
        run: docker logs passerelle
