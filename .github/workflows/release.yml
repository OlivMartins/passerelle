# Construit l'archive Linux x86_64, sa somme de contrôle et la page autonome,
# puis les joint à la release. Se déclenche à la publication d'une release,
# ou à la main (onglet Actions > Release > Run workflow) pour compléter une release existante.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de la release à compléter (par exemple v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  assets:
    name: Construire et joindre les fichiers
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Construire le binaire et l'archive
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          npm run build
      - name: Joindre les fichiers à la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --clobber \
            dist/passerelle-*-linux-x86_64.tar.gz \
            dist/passerelle-*-linux-x86_64.tar.gz.sha256 \
            dist/passerelle.html
