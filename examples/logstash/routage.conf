input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics_pattern => "app-.*-logs"
    group_id => "logstash-router"
    codec => json
    security_protocol => "SASL_SSL"
    sasl_mechanism => "SCRAM-SHA-512"
    sasl_jaas_config => "org.apache.kafka.common.security.scram.ScramLoginModule required username='${KAFKA_USERNAME}' password='${KAFKA_PASSWORD}';"
    add_field => { "[pipeline][name]" => "router" }
  }
}
filter {
  json { source => "payload" target => "data" skip_on_invalid_json => true }
  kv { source => "[data][extra]" field_split => "&" value_split => "=" target => "extra" }
  translate {
    source => "[data][country]"
    target => "[data][region]"
    dictionary => { "FR" => "EMEA" "DE" => "EMEA" "US" => "AMER" "JP" => "APAC" }
    fallback => "AUTRE"
  }
  fingerprint { source => ["[data][user_id]"] target => "[data][user_hash]" method => "SHA256" }
  if [level] == "DEBUG" and [env] != "prod" { drop {} }
  if [level] in ["ERROR", "FATAL"] {
    mutate { add_tag => ["alerte"] }
  }
}
output {
  if "alerte" in [tags] {
    kafka { bootstrap_servers => "kafka:9092" topic_id => "alerts" codec => json }
  } else if [data][region] == "EMEA" {
    kafka { bootstrap_servers => "kafka:9092" topic_id => "logs-emea-%{[env]}" codec => json }
  } else {
    kafka { bootstrap_servers => "kafka:9092" topic_id => "logs-others" codec => json }
  }
}
