input {
  kafka {
    bootstrap_servers => "kafka-1:9092,kafka-2:9092"
    topics => ["nginx-raw"]
    group_id => "logstash-nginx"
    auto_offset_reset => "earliest"
    codec => json
    decorate_events => true
  }
}

filter {
  grok {
    id => "parse_access"
    match => { "message" => "%{IPORHOST:[client][ip]} - %{DATA:[user][name]} \[%{HTTPDATE:ts}\] \"%{WORD:[http][method]} %{DATA:[url][path]} HTTP/%{NUMBER:[http][version]}\" %{NUMBER:[http][status]:int} %{NUMBER:[http][bytes]:int} \"%{DATA:referrer}\" \"%{DATA:agent}\"" }
  }
  date {
    match => ["ts", "dd/MMM/yyyy:HH:mm:ss Z"]
    target => "@timestamp"
    remove_field => ["ts"]
  }
  useragent { source => "agent" target => "user_agent" }
  geoip { source => "[client][ip]" target => "[client][geo]" }
  mutate {
    rename => { "referrer" => "[http][referrer]" }
    lowercase => ["[http][method]"]
    add_field => {
      "[event][dataset]" => "nginx.access"
      "[kafka][source_topic]" => "%{[@metadata][kafka][topic]}"
    }
    remove_field => ["message", "agent"]
  }
  if [http][status] >= 500 {
    mutate { add_tag => ["erreur_serveur"] }
  } else if [url][path] =~ /^\/health/ {
    drop { }
  }
}

output {
  kafka {
    bootstrap_servers => "kafka-1:9092,kafka-2:9092"
    topic_id => "nginx-parsed"
    codec => json
    message_key => "%{[client][ip]}"
    compression_type => "lz4"
  }
}
