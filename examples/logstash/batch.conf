input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["batch-events"]
    group_id => "logstash-batch"
    codec => plain
    consumer_threads => 4
  }
}
filter {
  dissect { mapping => { "message" => "%{date} %{time} [%{level}] %{service}: %{payload}" } }
  mutate { add_field => { "date_time" => "%{date} %{time}" } }
  date { match => ["date_time", "yyyy-MM-dd HH:mm:ss,SSS", "ISO8601"] timezone => "Europe/Paris" remove_field => ["date", "time", "date_time"] }
  json { source => "payload" target => "body" remove_field => ["payload"] }
  split { field => "[body][items]" }
  mutate { convert => { "[body][items][qty]" => "integer" } gsub => ["service", "[^a-z0-9]+", "_"] }
  ruby { code => "event.set('computed', event.get('[body][items][qty]').to_i * 2)" }
}
output {
  kafka { bootstrap_servers => "kafka:9092" topic_id => "batch-items" codec => json }
}
