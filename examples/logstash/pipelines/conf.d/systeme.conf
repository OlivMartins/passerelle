input { pipeline { address => "systeme" } }
filter {
  grok {
    match => { "message" => "<%{NONNEGINT:[log][syslog][priority]}>%{SYSLOGTIMESTAMP:horodatage} %{SYSLOGHOST:[host][hostname]} %{DATA:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?: %{GREEDYDATA:message}" }
    overwrite => ["message"]
  }
  syslog_pri { }
  date {
    match => ["horodatage", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
    remove_field => ["horodatage"]
  }
}
output {
  kafka {
    bootstrap_servers => "kafka:9092"
    topic_id => "logs-systeme"
    codec => json
  }
  pipeline { send_to => ["archive"] }
}
