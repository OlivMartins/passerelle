# Lecture des journaux bruts et répartition par type
input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["logs-bruts"]
    group_id => "logstash-entree"
    codec => json
  }
}
output {
  if [event][dataset] == "nginx.access" {
    pipeline { send_to => ["web"] }
  } else if [log][syslog] or [type] == "syslog" {
    pipeline { send_to => ["systeme"] }
  } else {
    pipeline { send_to => ["archive"] }
  }
}
