filter {
  grok {
    match => { "message" => "%{IPORHOST:[source][address]} - %{DATA:[user][name]} \[%{HTTPDATE:horodatage}\] \"%{WORD:[http][request][method]} %{DATA:[url][original]} HTTP/%{NUMBER:[http][version]}\" %{NUMBER:[http][response][status_code]:int} %{NUMBER:[http][response][body][bytes]:int}" }
  }
  date {
    match => ["horodatage", "dd/MMM/yyyy:HH:mm:ss Z"]
    remove_field => ["horodatage"]
  }
  if [http][response][status_code] >= 500 {
    mutate { add_tag => ["erreur_serveur"] }
  }
}
